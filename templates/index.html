<!DOCTYPE html>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SileroRead">

    <link rel="apple-touch-icon" href="/static/icon.png">

    <style>
        :root, body[data-theme="dark"] {
            --bg-base: #0c0e14;
            --bg-surface: #141721;
            --bg-card: #1b1f2e;
            --bg-card-hover: #22273a;
            --border-color: #262c40;
            --border-focus: #3b82f6;

            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-dim: #94a3b8;

            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;

            --font-size: 19px;
            --reader-font-family: 'Lora', Georgia, serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        body[data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #f1f5f9;
            --bg-card-hover: #e2e8f0;
            --border-color: #cbd5e1;
            --border-focus: #2563eb;

            --text-main: #0f172a;
            --text-muted: #94a3b8;
            --text-dim: #334155;

            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-amber: #d97706;
            --accent-red: #dc2626;
        }

        body[data-theme="sepia"] {
            --bg-base: #f4ecd8;
            --bg-surface: #ebdcb9;
            --bg-card: #e4d3a8;
            --bg-card-hover: #dbbe8f;
            --border-color: #d1b88a;
            --border-focus: #8b5a2b;

            --text-main: #433422;
            --text-muted: #7f6a52;
            --text-dim: #5c4b37;

            --accent-blue: #8b5a2b;
            --accent-cyan: #7c4b1d;
            --accent-amber: #b26a00;
            --accent-red: #9e2a2b;
        }

        body[data-theme="oled"] {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1c1c1c;
            --border-color: #262626;
            --border-focus: #00e5ff;

            --text-main: #ffffff;
            --text-muted: #666666;
            --text-dim: #a3a3a3;

            --accent-blue: #2979ff;
            --accent-cyan: #00e5ff;
            --accent-amber: #ff9100;
            --accent-red: #ff1744;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            transition: background 0.25s, color 0.25s;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* 1. TOP CONTROL BAR */
        .top-switch-bar {
            background: var(--bg-surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            z-index: 30;
            flex-shrink: 0;
        }

        .bar-left-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .bar-left-cluster::-webkit-scrollbar { display: none; }

        .file-upload-badge {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-size: 13px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
            max-width: 130px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .file-upload-badge input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer;
        }

        .modern-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        .icon-action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .icon-action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        .playback-controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-play-hero {
            background: linear-gradient(135deg, var(--accent-blue), #1d4ed8);
            border: none;
            color: #ffffff;
            height: 36px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-pause-hero {
            background: linear-gradient(135deg, var(--accent-amber), #b45309);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            display: none;
        }
        .btn-stop-hero {
            background: linear-gradient(135deg, var(--accent-red), #991b1b);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
            display: none;
        }

        /* 2. READER SETTINGS SUB-BAR */
        .reader-settings-deck {
            background: var(--bg-surface);
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
            position: relative;
        }

        .font-size-container {
            position: relative;
            display: inline-block;
        }
        .font-size-popover {
            position: absolute;
            top: 40px;
            left: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 50;
        }
        .font-size-popover.hidden {
            display: none;
        }
        .font-size-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            min-width: 40px;
            text-align: center;
        }

        .speed-container {
            position: relative;
            display: inline-block;
        }
        .speed-popover {
            position: absolute;
            top: 40px;
            left: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 50;
            min-width: 220px;
        }
        .speed-popover.hidden {
            display: none;
        }
        .speed-popover input[type="range"] {
            width: 150px;
            accent-color: var(--accent-cyan);
        }
        .speed-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            min-width: 52px;
            text-align: right;
        }

        .chunk-nav {
            display: flex;
            gap: 20px;
            margin-left: auto;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--text-main);
        }
        .modal-box h3 { margin-top: 0; margin-bottom: 15px; font-size: 16px; }
        .modal-box input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .modal-box input:focus { outline: none; border-color: var(--accent-cyan); }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .modal-actions button {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        .modal-actions .btn-cancel { background: #475569; color: #fff; }
        .modal-actions .btn-primary { background: var(--accent-cyan); color: #0c0e14; }
        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            gap: 10px;
            background: var(--bg-card);
        }
        .bookmark-item .bm-text { flex: 1; overflow: hidden; min-width: 0; }
        .bookmark-item .bm-name {
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bookmark-item .bm-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .bookmark-item .bm-btn {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }
        .bookmark-item .bm-btn.delete { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }

        /* 3. TRACK & FILE INFO */
        .track-info-strip {
            padding: 4px 12px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .track-title-text {
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        /* 4. TEXT VIEWPORT */
        .content-viewport {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            padding: 20px 24px;
            font-family: var(--reader-font-family);
        }
        .content-viewport::-webkit-scrollbar { width: 6px; }
        .content-viewport::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .paragraph {
            margin-bottom: 1.4em;
            line-height: 1.75;
            font-size: var(--font-size);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-dim);
            transition: 0.15s ease;
            border-left: 3px solid transparent;
        }
        .paragraph:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }
        .paragraph.active-text {
            background: var(--bg-card);
            color: var(--text-main);
            border-left: 3px solid var(--accent-cyan);
        }

        .chunk-active {
            text-decoration: underline;
            text-decoration-color: var(--accent-cyan);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }
        .fb2-image {
            max-width: 85%;
            height: auto;
            border-radius: var(--radius-md);
            margin: 15px auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        /* 5. BOTTOM SHELF */
        .bottom-shelf {
            background: var(--bg-surface);
            padding: 6px 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            z-index: 20;
        }
        .shelf-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        .prefetch-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
            font-size: 10px;
        }
        .progress-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 7px;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: 700;
        }

        /* LOCK SCREEN OVERLAY */
        .lock-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(12, 14, 20, 0.96);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lock-overlay.hidden { display: none; }
        .unlock-pad {
            width: 260px;
            padding: 30px 20px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            color: var(--text-muted);
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .unlock-pad span:first-child {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-amber);
        }

        audio { display: none; }
    </style>
</head>

<script>
    const playBtn = document.getElementById('playBtn'), stopBtn = document.getElementById('stopBtn'), pauseBtn = document.getElementById('pauseBtn');
    const readerBody = document.getElementById('readerBody'), voiceSelect = document.getElementById('voiceSelect');
    const audioPlayer = document.getElementById('audioPlayer'), statusInfo = document.getElementById('statusInfo');
    const bufferInfo = document.getElementById('bufferInfo');
    const progressInfo = document.getElementById('progressInfo'), fileNameDisp = document.getElementById('fileNameDisp');
    const deckBookTitle = document.getElementById('deck-book-title'), deckFormatInfo = document.getElementById('deck-format-info');
    
    const fontSelect = document.getElementById('fontSelect');
    const speedToggleBtn = document.getElementById('speedToggleBtn');
    const speedPopover = document.getElementById('speedPopover');
    const speedRange = document.getElementById('speedRange');
    const speedBtnText = document.getElementById('speedBtnText');
    const speedDisp = document.getElementById('speedDisp');
    const fontSizeToggleBtn = document.getElementById('fontSizeToggleBtn');
    const fontSizePopover = document.getElementById('fontSizePopover');
    const fontSizeBtnText = document.getElementById('fontSizeBtnText');
    const fontSizeDisp = document.getElementById('fontSizeDisp');
    const themeSelect = document.getElementById('themeSelect');

    let allBlocks = []; 
    let textParagraphs = []; 
    let currentIndex = 0; // Индекс текущего абзаца
    
    // Единицы чтения: плоский массив под-кусков (чанков)
    let readingUnits = []; 
    let currentUnitIndex = 0;

    // Prefetch Очередь
    let playlist = []; // [ { url, paragraphIndex, unitIndex, text } ]
    let lastRequestedUnitIndex = -1; // Устранение бага повтора чанков

    let isFetching = false;
    let isPlaying = false;
    let isPaused = false;
    let bookKey = '';
    let currentSessionId = 0;
    let hasPendingJump = false; // true, если пользователь вручную прыгнул на чанк
    
    const PREFETCH_AHEAD = 6;
    const MAX_PLAYLIST = 12;

    // Оценка времени воспроизведения
    let timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
    const SAMPLE_SIZE = 5;

    // ================= WAKE LOCK =================
    // Не даём экрану гаснуть во время воспроизведения
    let wakeLock = null;

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) {
            console.warn("⚠️ Wake Lock API не поддерживается");
            return;
        }
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            console.log("✅ Wake Lock активен");
            wakeLock.addEventListener('release', () => {
                console.log("🔓 Wake Lock освобождён");
                wakeLock = null;
                // Если всё ещё играем — перезапрашиваем
                if (isPlaying && !isPaused) {
                    setTimeout(requestWakeLock, 1000);
                }
            });
        } catch (e) {
            console.warn("⚠️ Wake Lock не удалось запросить:", e);
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    // ================= АУДИО-ОШИБКИ =================
    audioPlayer.addEventListener('error', (e) => {
        console.error("❌ Audio error:", audioPlayer.error);
        if (isPlaying && !isPaused) {
            setTimeout(() => {
                audioPlayer.play().catch(err => console.error("Retry failed:", err));
            }, 500);
        }
    });
    audioPlayer.addEventListener('stalled', () => console.warn("⚠️ Audio stalled"));
    audioPlayer.addEventListener('suspend', () => console.warn("⚠️ Audio suspended"));
    audioPlayer.addEventListener('waiting', () => console.warn("⚠️ Audio waiting"));
    audioPlayer.addEventListener('abort', () => console.warn("⚠️ Audio aborted"));

    // ================= ВОЗВРАТ ИЗ ФОНА =================
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isPlaying && !isPaused) {
            console.log("📱 Вернулись из фона, проверяем аудио...");
            setTimeout(() => {
                if (audioPlayer.paused && isPlaying) {
                    console.warn("⚠️ Система поставила на паузу, возобновляем...");
                    audioPlayer.play().catch(e => console.error("Resume failed:", e));
                }
                if (!wakeLock) requestWakeLock();
            }, 500);
        }
    });
    // 1. Font Family Preference
    const savedFont = localStorage.getItem('reader-font') || "'Lora', Georgia, serif";
    fontSelect.value = savedFont;
    document.documentElement.style.setProperty('--reader-font-family', savedFont);

    fontSelect.addEventListener('change', () => {
        const val = fontSelect.value;
        document.documentElement.style.setProperty('--reader-font-family', val);
        localStorage.setItem('reader-font', val);
    });

    // 2. Playback Speed Preference (slider)
    let currentPlaybackRate = parseFloat(localStorage.getItem('reader-speed')) || 1.0;
    // Защита от старых значений вне диапазона
    if (currentPlaybackRate < 0.5) currentPlaybackRate = 0.5;
    if (currentPlaybackRate > 2.0) currentPlaybackRate = 2.0;

    function updateSpeedUI() {
        const txt = currentPlaybackRate.toFixed(2) + 'x';
        speedRange.value = currentPlaybackRate.toString();
        speedBtnText.textContent = txt;
        speedDisp.textContent = txt;
        audioPlayer.playbackRate = currentPlaybackRate;
    }
    updateSpeedUI();

    speedToggleBtn.onclick = (e) => {
        e.stopPropagation();
        speedPopover.classList.toggle('hidden');
    };

    speedRange.addEventListener('input', () => {
        currentPlaybackRate = parseFloat(speedRange.value);
        updateSpeedUI();
    });

    speedRange.addEventListener('change', () => {
        localStorage.setItem('reader-speed', currentPlaybackRate);
        updateTimeEstimate();
    });

    document.addEventListener('click', (e) => {
        if (!speedPopover.contains(e.target) && e.target !== speedToggleBtn) {
            speedPopover.classList.add('hidden');
        }
    });

    // 3. Font Size Controls
    let currentFontSize = parseInt(localStorage.getItem('reader-font-size')) || 19;
    function updateFontSize() {
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        fontSizeBtnText.textContent = `[${currentFontSize}px]`;
        fontSizeDisp.textContent = currentFontSize + 'px';
        localStorage.setItem('reader-font-size', currentFontSize);
    }
    updateFontSize();

    fontSizeToggleBtn.onclick = (e) => {
        e.stopPropagation();
        fontSizePopover.classList.toggle('hidden');
    };

    document.addEventListener('click', (e) => {
        if (!fontSizePopover.contains(e.target) && e.target !== fontSizeToggleBtn) {
            fontSizePopover.classList.add('hidden');
        }
    });

    document.getElementById('btnFontMinus').onclick = (e) => {
        e.stopPropagation();
        currentFontSize = Math.max(12, currentFontSize - 2);
        updateFontSize();
    };
    document.getElementById('btnFontPlus').onclick = (e) => {
        e.stopPropagation();
        currentFontSize = Math.min(36, currentFontSize + 2);
        updateFontSize();
    };

    // 4. Color Theme Selection
    const savedTheme = localStorage.getItem('reader-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    if (themeSelect) {
        themeSelect.value = savedTheme;
        themeSelect.addEventListener('change', () => {
            const theme = themeSelect.value;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('reader-theme', theme);
        });
    }

    // 5. Scroll Observation
    const observer = new IntersectionObserver((entries) => {
        if (isPlaying) return; 
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const idx = parseInt(entry.target.id.replace('p-', ''));
                if (idx !== currentIndex) {
                    currentIndex = idx;
                    syncCurrentUnitFromParagraph();
                    updateProgress();
                    saveDebounced(); 
                }
            }
        });
    }, { root: readerBody, rootMargin: '0px', threshold: 0.5 });

    // 6. File Upload & Parsing Handler
    document.getElementById('fb2File').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        stop();
        fileNameDisp.textContent = file.name;
        fileNameDisp.parentElement.title = file.name;
        deckBookTitle.textContent = file.name;
        bookKey = file.name; 
        const ext = file.name.split('.').pop().toLowerCase();
        deckFormatInfo.textContent = `${ext.toUpperCase()} • READY`;

        statusInfo.textContent = "Processing file...";
        readerBody.innerHTML = '<div style="text-align: center; margin-top: 60px; color: var(--text-muted); font-size:14px;">Parsing document...</div>';

        if (ext === 'fb2' || ext === 'xml') {
            const reader = new FileReader();
            reader.onload = (evt) => parseFB2(evt.target.result);
            reader.readAsText(file);
        } 
        else if (ext === 'txt') {
            const reader = new FileReader();
            reader.onload = (evt) => parseTXT(evt.target.result);
            reader.readAsText(file);
        } 
        else if (ext === 'docx') {
            const reader = new FileReader();
            reader.onload = (evt) => parseDOCX(evt.target.result);
            reader.readAsArrayBuffer(file);
        }
        else if (ext === 'pdf') {
            const reader = new FileReader();
            reader.onload = (evt) => parsePDF(evt.target.result);
            reader.readAsArrayBuffer(file);
        }
    });

    async function parsePDF(arrayBuffer) {
        try {
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                let rawPageText = textContent.items.map(item => item.str).join(" ");
                rawPageText = rawPageText.replace(/\s+/g, ' ');
                fullText += rawPageText + " ";
            }
            let formattedText = fullText.replace(/([.?!])\s+([A-Za-zА-Яа-яЁё])/g, "$1\n$2");
            parseTXT(formattedText);
        } catch (err) {
            console.error(err);
            statusInfo.textContent = "PDF reading error";
        }
    }

    function parseFB2(xmlString) {
        const xml = new DOMParser().parseFromString(xmlString, "text/xml");
        const binaries = {};
        const binaryTags = xml.getElementsByTagName('binary');
        for(let i = 0; i < binaryTags.length; i++) {
            const id = binaryTags[i].getAttribute('id');
            const cType = binaryTags[i].getAttribute('content-type') || 'image/jpeg';
            const base64Data = binaryTags[i].textContent.replace(/\s+/g, '');
            binaries[id] = `data:${cType};base64,${base64Data}`;
        }

        allBlocks = []; textParagraphs = []; let pIndex = 0;
        const getHref = (node) => {
            for (let j = 0; j < node.attributes.length; j++) {
                if (node.attributes[j].name.includes('href')) return node.attributes[j].value;
            }
            return null;
        };

        const coverpages = xml.getElementsByTagName('coverpage');
        if (coverpages.length > 0) {
            const coverImages = coverpages[0].getElementsByTagName('image');
            for (let img of coverImages) {
                const href = getHref(img);
                if (href) {
                    const id = href.replace(/^#/, '');
                    if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                }
            }
        }

        const bodies = xml.getElementsByTagName('body');
        for (let b = 0; b < bodies.length; b++) {
            const walk = (node) => {
                if (node.nodeType === 1) {
                    const tagName = node.tagName.replace(/^.*:/, '').toLowerCase();
                    if (['p', 'v', 'subtitle', 'text-author'].includes(tagName)) {
                        const text = node.textContent.replace(/[*#]/g, '').trim();
                        if (text.length > 2) {
                            const block = { type: 'text', text: text, index: pIndex++ };
                            allBlocks.push(block); textParagraphs.push(block);
                        }
                    } else if (tagName === 'image') {
                        const href = getHref(node);
                        if (href) {
                            const id = href.replace(/^#/, '');
                            if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                        }
                    } else {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                    }
                }
            };
            walk(bodies[b]);
        }
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseTXT(textString) {
        allBlocks = []; textParagraphs = []; let pIndex = 0;
        const lines = textString.split(/\r?\n/);
        lines.forEach(line => {
            const text = line.trim();
            if (text.length > 2) {
                const block = { type: 'text', text: text, index: pIndex++ };
                allBlocks.push(block); textParagraphs.push(block);
            }
        });
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseDOCX(arrayBuffer) {
        mammoth.convertToHtml({arrayBuffer: arrayBuffer})
            .then(function(result) {
                const htmlString = result.value; 
                const doc = new DOMParser().parseFromString(htmlString, "text/html");
                allBlocks = []; textParagraphs = []; let pIndex = 0;

                const walk = (node) => {
                    if (node.nodeType === 1) { 
                        const tagName = node.tagName.toLowerCase();
                        if (tagName === 'img') {
                            const src = node.getAttribute('src');
                            if (src) allBlocks.push({ type: 'image', src: src });
                        } 
                        else if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li'].includes(tagName)) {
                            const text = node.textContent.trim();
                            if (text.length > 2) {
                                const block = { type: 'text', text: text, index: pIndex++ };
                                allBlocks.push(block); textParagraphs.push(block);
                            }
                        } else {
                            for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                        }
                    }
                };
                walk(doc.body);
                buildReadingUnitsServer().then(() => loadProgressAndRender());
            });
    }

    // Разбиение через серверный эндпоинт /api/split
    async function buildReadingUnitsServer() {
        readingUnits = [];
        let unitCounter = 0;
        statusInfo.textContent = "Splitting into sentences...";

        try {
            const rawParagraphs = textParagraphs.map(p => p.text);
            const res = await fetch('/api/split', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paragraphs: rawParagraphs })
            });
            const data = await res.json();

            if (data.results && data.results.length === textParagraphs.length) {
                for (let i = 0; i < textParagraphs.length; i++) {
                    const chunks = data.results[i];
                    for (const ch of chunks) {
                        readingUnits.push({
                            unitIndex: unitCounter++,
                            paragraphIndex: textParagraphs[i].index,
                            text: ch
                        });
                    }
                }
            } else {
                fallbackSplit(unitCounter);
            }
        } catch (e) {
            console.warn("Server split failed, fallback to raw paragraphs:", e);
            fallbackSplit(unitCounter);
        }
    }

    function fallbackSplit(unitCounter) {
        readingUnits = [];
        for (const p of textParagraphs) {
            readingUnits.push({
                unitIndex: unitCounter++,
                paragraphIndex: p.index,
                text: p.text
            });
        }
    }

    function syncCurrentUnitFromParagraph() {
        const found = readingUnits.findIndex(u => u.paragraphIndex === currentIndex);
        currentUnitIndex = found !== -1 ? found : 0;
        lastRequestedUnitIndex = currentUnitIndex - 1;
    }

    function loadProgressAndRender() {
        fetch(`/load_progress?book_name=${encodeURIComponent(bookKey)}`)
            .then(r => r.json())
            .then(data => {
                currentIndex = data.index || 0;
                if (currentIndex >= textParagraphs.length) currentIndex = 0;
                syncCurrentUnitFromParagraph();
                render();
            }).catch(() => { 
                currentIndex = 0; 
                syncCurrentUnitFromParagraph();
                render(); 
            });
    }

    function render() {
        observer.disconnect(); readerBody.innerHTML = ''; statusInfo.textContent = "Ready to read";
        allBlocks.forEach(block => {
            if (block.type === 'text') {
                const div = document.createElement('div');
                div.className = 'paragraph'; div.id = 'p-' + block.index;
                div.textContent = block.text;
                div.onclick = () => { 
                    // Не реагируем, если пользователь выделяет/копирует текст
                    const sel = window.getSelection();
                    if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
                        return;
                    }
                    
                    currentIndex = block.index; 
                    syncCurrentUnitFromParagraph();
                    saveDebounced(); 
                    
                    if(isPlaying) {
                        stop();
                        setTimeout(() => { playBtn.click(); }, 120);
                    } else {
                        scrollToCurrent();
                    }
                };
                readerBody.appendChild(div);
            } else if (block.type === 'image') {
                const img = document.createElement('img');
                img.src = block.src; img.className = 'fb2-image';
                readerBody.appendChild(img);
            }
        });
        updateProgress();
        setTimeout(scrollToCurrent, 100);
    }

    let saveTimeout;
    function saveDebounced() {
        updateProgress(); clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            fetch('/save_progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_name: bookKey, index: currentIndex })
            }).catch(err => console.error("Progress save failed:", err));
        }, 1000); 
    }

    function updateProgress() {
        if (textParagraphs.length > 0) {
            progressInfo.textContent = `${currentIndex + 1} / ${textParagraphs.length}`;
        }
        bufferInfo.textContent = `buf: ${playlist.length}/${PREFETCH_AHEAD}`;
    }

    function scrollToCurrent() {
        const el = document.getElementById('p-' + currentIndex);
        if(el) {
            document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
            el.classList.add('active-text');
            observer.disconnect();

            const targetScrollTop = el.offsetTop - readerBody.offsetTop - (readerBody.clientHeight / 2) + (el.clientHeight / 2);
            readerBody.scrollTo({
                top: Math.max(0, targetScrollTop),
                behavior: 'smooth'
            });

            setTimeout(() => {
                document.querySelectorAll('.paragraph').forEach(p => observer.observe(p));
            }, 500);
        }
    }

    function updateMediaSession(text) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'SileroRead',
                artist: text.length > 40 ? text.substring(0, 40) + '...' : text,
                album: bookKey || 'Audiobook'
            });
            
            navigator.mediaSession.setActionHandler('play', () => { if(isPaused) playBtn.click(); });
            navigator.mediaSession.setActionHandler('pause', () => { pauseBtn.click(); });
            navigator.mediaSession.setActionHandler('stop', () => { stopBtn.click(); });
            navigator.mediaSession.setActionHandler('nexttrack', () => { 
                if(isPlaying) {
                    stop();
                    currentIndex = Math.min(currentIndex + 1, textParagraphs.length - 1);
                    syncCurrentUnitFromParagraph();
                    playBtn.click();
                }
            });
        }
    }

    playBtn.onclick = () => {
        requestWakeLock(); // ★ запрашиваем блокировку сна

        if (isPaused) {
            isPaused = false;
            audioPlayer.play();
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            statusInfo.textContent = "Playing...";
            fetchNext(); 
            return;
        }

        if(!readingUnits.length) return;
        currentSessionId++; 
        isPlaying = true; 
        isPaused = false;
        playBtn.style.display = 'none'; 
        pauseBtn.style.display = 'flex';
        stopBtn.style.display = 'flex';
        
        playlist = [];
        // Если пользователь вручную прыгнул (⏮/⏭ на паузе) — сохраняем позицию
        if (!hasPendingJump) {
            syncCurrentUnitFromParagraph();
        }
        hasPendingJump = false;
        statusInfo.textContent = "Buffering audio...";
        fetchNext();
    };

        pauseBtn.onclick = () => {
        releaseWakeLock(); // ★ при паузе экран может гаснуть
        isPaused = true;
        audioPlayer.pause();
        playBtn.style.display = 'flex';
        pauseBtn.style.display = 'none';
        statusInfo.textContent = "Paused";
    };

    stopBtn.onclick = stop;

        function stop() {
        releaseWakeLock(); // ★ снимаем блокировку сна
        currentSessionId++; 
        isPlaying = false; 
        isPaused = false; 
        isFetching = false; 
        playlist = [];
        lastRequestedUnitIndex = -1;
        audioPlayer.pause(); 
        audioPlayer.src = ""; 
        playBtn.style.display = 'flex'; 
        pauseBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        statusInfo.textContent = "Stopped";
        clearChunkHighlight();
        timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
        updateTimeEstimate();
        updateProgress();
    }

    // ================= ПЕРЕСКОК ПО ЧАНКАМ (⏮ / ⏭) =================
    function jumpToUnit(targetIndex) {
        if (!readingUnits.length) return;
        if (targetIndex < 0 || targetIndex >= readingUnits.length) return;

        const wasPlaying = isPlaying && !isPaused;

        // Останавливаем текущее аудио и сбрасываем сессию
        currentSessionId++;
        playlist = [];
        isFetching = false;
        audioPlayer.pause();
        audioPlayer.src = "";
        audioPlayer.currentTime = 0;

        // Устанавливаем новую позицию
        currentUnitIndex = targetIndex;
        lastRequestedUnitIndex = targetIndex - 1;

        const item = readingUnits[targetIndex];
        if (item) {
            currentIndex = item.paragraphIndex;
            scrollToCurrent();
            saveDebounced();
        }
        updateProgress();
        updateTimeEstimate();

        if (wasPlaying) {
            // Продолжаем воспроизведение с новой позиции
            isPlaying = true;
            isPaused = false;
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            stopBtn.style.display = 'flex';
            statusInfo.textContent = `Chunk ${targetIndex + 1} / ${readingUnits.length}`;
            fetchNext();
        } else {
            // Были на паузе — просто перескочили, не играем
            isPlaying = false;
            isPaused = false;
            playBtn.style.display = 'flex';
            pauseBtn.style.display = 'none';
            stopBtn.style.display = 'none';
            statusInfo.textContent = `Jumped to chunk ${targetIndex + 1} / ${readingUnits.length}`;
            hasPendingJump = true;
        }
    }

    document.getElementById('prevBtn').onclick = () => {
        jumpToUnit(currentUnitIndex - 1);
    };

    document.getElementById('nextBtn').onclick = () => {
        jumpToUnit(currentUnitIndex + 1);
    };

    // Prefetch: последовательные запросы к серверу
    function fetchNext() {
        if (!isPlaying || isFetching || isPaused) return;

        const nextTargetUnitIndex = Math.max(lastRequestedUnitIndex + 1, currentUnitIndex);

        if (nextTargetUnitIndex >= readingUnits.length) return;
        if (playlist.length >= MAX_PLAYLIST) return;

        if (playlist.length >= PREFETCH_AHEAD && !audioPlayer.paused) return;

        isFetching = true;
        lastRequestedUnitIndex = nextTargetUnitIndex;

        const item = readingUnits[nextTargetUnitIndex];
        const fetchSessionId = currentSessionId;

        const fd = new FormData();
        fd.append('text', item.text);
        fd.append('voice', voiceSelect.value);

        fetch('/synthesize', { method: 'POST', body: fd })
            .then(r => r.json())
            .then(data => {
                isFetching = false;
                if (!isPlaying || fetchSessionId !== currentSessionId) return;

                if (data.success) {
                    playlist.push({ 
                        url: data.audio_url, 
                        paragraphIndex: item.paragraphIndex,
                        unitIndex: item.unitIndex,
                        text: item.text 
                    });
                    updateProgress();

                    if (audioPlayer.paused && playlist.length >= 1 && !isPaused) {
                        playAudio();
                    }
                    
                    fetchNext();
                } else {
                    console.error("Server error:", data.error);
                    statusInfo.textContent = "Error: " + data.error;
                    lastRequestedUnitIndex--;
                }
            }).catch(() => { 
                isFetching = false; 
                lastRequestedUnitIndex--;
                statusInfo.textContent = "Network waiting...";
            });
    }

    // ================= ПОДСВЕТКА ТЕКУЩЕГО ЧАНКА =================
    function findChunkRange(fullText, chunkText) {
        // Прямой поиск
        let idx = fullText.indexOf(chunkText);
        if (idx !== -1) return { start: idx, end: idx + chunkText.length };

        // Гибкий поиск по пробелам через regex
        try {
            const escaped = chunkText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const flexible = escaped.replace(/\s+/g, '\\s+');
            const regex = new RegExp(flexible);
            const match = fullText.match(regex);
            if (match) {
                return { start: match.index, end: match.index + match[0].length };
            }
        } catch (e) {
            console.warn("Regex failed:", e);
        }
        return null;
    }

    function clearChunkHighlight() {
        document.querySelectorAll('.chunk-active').forEach(span => {
            const parent = span.parentNode;
            if (!parent) return;
            const textNode = document.createTextNode(span.textContent);
            parent.replaceChild(textNode, span);
            parent.normalize();
        });
    }

    function highlightChunk(paragraphIndex, chunkText) {
        clearChunkHighlight();

        const para = document.getElementById('p-' + paragraphIndex);
        if (!para) return;

        const fullText = para.textContent;
        const range = findChunkRange(fullText, chunkText);
        if (!range) {
            console.warn("Chunk not found in paragraph:", chunkText.substring(0, 40));
            return;
        }

        const before = fullText.substring(0, range.start);
        const middle = fullText.substring(range.start, range.end);
        const after = fullText.substring(range.end);

        para.textContent = '';
        if (before) para.appendChild(document.createTextNode(before));
        const span = document.createElement('span');
        span.className = 'chunk-active';
        span.textContent = middle;
        para.appendChild(span);
        if (after) para.appendChild(document.createTextNode(after));

        scrollToElementCenter(span);
    }

    function scrollToElementCenter(el) {
        const rect = el.getBoundingClientRect();
        const bodyRect = readerBody.getBoundingClientRect();
        const elTopInBody = rect.top - bodyRect.top + readerBody.scrollTop;
        const targetScrollTop = elTopInBody - (readerBody.clientHeight / 2) + (rect.height / 2);

        readerBody.scrollTo({
            top: Math.max(0, targetScrollTop),
            behavior: 'smooth'
        });
    }

    function playAudio() {
        if (!isPlaying || !playlist.length || isPaused) return;
        
        const audioItem = playlist.shift();
        currentUnitIndex = audioItem.unitIndex;
        
        if (currentIndex !== audioItem.paragraphIndex) {
            currentIndex = audioItem.paragraphIndex;
            saveDebounced();
        }
        
        // Подсвечиваем текущий чанк и скроллим к нему
        highlightChunk(audioItem.paragraphIndex, audioItem.text);
        // Помечаем абзац активным (для левой полоски)
        document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
        const activePara = document.getElementById('p-' + audioItem.paragraphIndex);
        if (activePara) activePara.classList.add('active-text');
        
        updateProgress();
        updateMediaSession(audioItem.text);
        
        statusInfo.textContent = "Speaking...";
        audioPlayer.src = audioItem.url;
        audioPlayer.playbackRate = currentPlaybackRate;
        
        audioPlayer.play().catch(e => {
            console.error("Playback prevented:", e);
        });

        // Сбор длительности для оценки времени
        const onMeta = () => {
            const dur = audioPlayer.duration;
            if (isFinite(dur) && dur > 0 && timingStats.sampleCount < SAMPLE_SIZE) {
                timingStats.totalChars += audioItem.text.length;
                timingStats.totalDuration += dur;
                timingStats.sampleCount++;
                updateTimeEstimate();
            }
            audioPlayer.removeEventListener('loadedmetadata', onMeta);
        };
        audioPlayer.addEventListener('loadedmetadata', onMeta);
        updateTimeEstimate();

        fetchNext();
    }

    audioPlayer.onended = () => {
        if (isPlaying && !isPaused) {
            if (playlist.length > 0) {
                playAudio();
            } else if (lastRequestedUnitIndex + 1 < readingUnits.length) {
                statusInfo.textContent = "Buffering next...";
                fetchNext();
            } else {
                stop();
                statusInfo.textContent = "Finished reading";
            }
        }
    };

    // ================= ОЦЕНКА ВРЕМЕНИ =================
    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '--';
        if (sec < 60) return Math.round(sec) + 'с';
        if (sec < 3600) return Math.round(sec / 60) + 'м';
        const h = Math.floor(sec / 3600);
        const m = Math.round((sec % 3600) / 60);
        return h + 'ч ' + m + 'м';
    }

    function updateTimeEstimate() {
        const timeInfo = document.getElementById('timeInfo');
        if (!timeInfo) return;
        if (timingStats.sampleCount < 1 || !readingUnits.length) {
            timeInfo.textContent = '⏱ --';
            return;
        }
        const charsPerSec = timingStats.totalChars / timingStats.totalDuration;
        if (!isFinite(charsPerSec) || charsPerSec <= 0) {
            timeInfo.textContent = '⏱ --';
            return;
        }
        let remainingChars = 0;
        for (let i = currentUnitIndex; i < readingUnits.length; i++) {
            remainingChars += readingUnits[i].text.length;
        }
        const remainingSec = remainingChars / charsPerSec / currentPlaybackRate;
        timeInfo.textContent = '⏱ ~' + formatTime(remainingSec);
    }

    // ================= ЗАКЛАДКИ =================
    async function loadBookmarks() {
        if (!bookKey) return [];
        try {
            const res = await fetch(`/api/bookmarks?book_name=${encodeURIComponent(bookKey)}`);
            const data = await res.json();
            return data.success ? data.bookmarks : [];
        } catch (e) {
            console.error('loadBookmarks error:', e);
            return [];
        }
    }

    function openBookmarkModal() {
        if (!readingUnits.length) {
            statusInfo.textContent = '⚠️ Сначала загрузи книгу';
            return;
        }
        const currentItem = readingUnits[currentUnitIndex];
        const defaultName = currentItem ? currentItem.text.substring(0, 40) : '';
        document.getElementById('bookmarkNameInput').value = defaultName;
        document.getElementById('bookmarkModal').classList.remove('hidden');
        setTimeout(() => {
            const inp = document.getElementById('bookmarkNameInput');
            inp.focus();
            inp.select();
        }, 100);
    }

    function closeBookmarkModal() {
        document.getElementById('bookmarkModal').classList.add('hidden');
    }

    async function confirmSaveBookmark() {
        const name = document.getElementById('bookmarkNameInput').value.trim();
        const currentItem = readingUnits[currentUnitIndex];
        if (!currentItem) return;

        try {
            const res = await fetch('/api/bookmarks/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    book_name: bookKey,
                    unit_index: currentUnitIndex,
                    paragraph_index: currentItem.paragraphIndex,
                    text: currentItem.text,
                    name: name || currentItem.text.substring(0, 30)
                })
            });
            const data = await res.json();
            if (data.success) {
                closeBookmarkModal();
                statusInfo.textContent = '⭐ Закладка сохранена';
                setTimeout(() => {
                    if (isPlaying) statusInfo.textContent = 'Speaking...';
                    else statusInfo.textContent = 'Ready to read';
                }, 2000);
            } else {
                alert('Ошибка: ' + data.error);
            }
        } catch (e) {
            alert('Ошибка соединения');
        }
    }

    async function openBookmarksList() {
        if (!bookKey) {
            statusInfo.textContent = '⚠️ Сначала загрузи книгу';
            return;
        }
        const bm = await loadBookmarks();
        const list = document.getElementById('bookmarksList');
        if (!bm.length) {
            list.innerHTML = '<div style="color:var(--text-muted); padding:20px; text-align:center;">Закладок пока нет</div>';
        } else {
            list.innerHTML = bm.map(b => `
                <div class="bookmark-item">
                    <div class="bm-text">
                        <div class="bm-name">${escapeHtml(b.name)}</div>
                        <div class="bm-meta">${b.created_at} · чанк ${b.unit_index + 1}</div>
                    </div>
                    <button class="bm-btn" onclick="jumpToBookmark(${b.unit_index})">→</button>
                    <button class="bm-btn delete" onclick="deleteBookmark(${b.id})">🗑</button>
                </div>
            `).join('');
        }
        document.getElementById('bookmarksListModal').classList.remove('hidden');
    }

    function closeBookmarksList() {
        document.getElementById('bookmarksListModal').classList.add('hidden');
    }

    function jumpToBookmark(unitIndex) {
        closeBookmarksList();
        if (unitIndex >= 0 && unitIndex < readingUnits.length) {
            jumpToUnit(unitIndex);
        }
    }

    async function deleteBookmark(id) {
        try {
            const res = await fetch('/api/bookmarks/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_name: bookKey, id: id })
            });
            const data = await res.json();
            if (data.success) openBookmarksList();
        } catch (e) {
            alert('Ошибка удаления');
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    const _addBmBtn = document.getElementById('addBookmarkBtn');
    const _showBmBtn = document.getElementById('showBookmarksBtn');
    if (_addBmBtn) _addBmBtn.onclick = openBookmarkModal;
    if (_showBmBtn) _showBmBtn.onclick = openBookmarksList;

    // 7. Lock Screen Logic
    const lockBtn = document.getElementById('lockBtn');
    const lockOverlay = document.getElementById('lock-overlay');
    const unlockZone = document.getElementById('unlock-zone');
    let unlockTimeout;

    lockBtn.addEventListener('click', () => {
        lockOverlay.classList.remove('hidden');
    });

    function startUnlockTimer() {
        unlockZone.style.borderColor = 'var(--accent-cyan)';
        unlockZone.style.color = 'var(--accent-cyan)';
        
        unlockTimeout = setTimeout(() => {
            lockOverlay.classList.add('hidden');
            unlockZone.style.borderColor = 'var(--border-color)';
            unlockZone.style.color = 'var(--text-muted)';
        }, 1000);
    }

    function cancelUnlockTimer() {
        clearTimeout(unlockTimeout);
        unlockZone.style.borderColor = 'var(--border-color)';
        unlockZone.style.color = 'var(--text-muted)';
    }

    unlockZone.addEventListener('touchstart', (e) => { 
        e.preventDefault();
        startUnlockTimer(); 
    }, {passive: false});
    
    unlockZone.addEventListener('touchend', cancelUnlockTimer);
    unlockZone.addEventListener('touchcancel', cancelUnlockTimer);
    
    unlockZone.addEventListener('mousedown', startUnlockTimer);
    unlockZone.addEventListener('mouseup', cancelUnlockTimer);
    unlockZone.addEventListener('mouseleave', cancelUnlockTimer);

    lockOverlay.addEventListener('click', (e) => {
        if (e.target === lockOverlay) {
            e.stopPropagation();
        }
    });

    // 8. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .catch(err => console.log('SW registration error:', err));
        });
    }
</script>
