<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SileroRead • Stream Deck</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0c0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SileroRead">
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    
    <!-- UI & Reading Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    
    <style>
        :root, body[data-theme="dark"] {
            --bg-base: #0c0e14;
            --bg-surface: #141721;
            --bg-card: #1b1f2e;
            --bg-card-hover: #22273a;
            --border-color: #262c40;
            --border-focus: #3b82f6;

            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-dim: #94a3b8;

            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;

            --font-size: 19px;
            --reader-font-family: 'Lora', Georgia, serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        body[data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #f1f5f9;
            --bg-card-hover: #e2e8f0;
            --border-color: #cbd5e1;
            --border-focus: #2563eb;

            --text-main: #0f172a;
            --text-muted: #94a3b8;
            --text-dim: #334155;

            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-amber: #d97706;
            --accent-red: #dc2626;
        }

        body[data-theme="sepia"] {
            --bg-base: #f4ecd8;
            --bg-surface: #ebdcb9;
            --bg-card: #e4d3a8;
            --bg-card-hover: #dbbe8f;
            --border-color: #d1b88a;
            --border-focus: #8b5a2b;

            --text-main: #433422;
            --text-muted: #7f6a52;
            --text-dim: #5c4b37;

            --accent-blue: #8b5a2b;
            --accent-cyan: #7c4b1d;
            --accent-amber: #b26a00;
            --accent-red: #9e2a2b;
        }

        body[data-theme="oled"] {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1c1c1c;
            --border-color: #262626;
            --border-focus: #00e5ff;

            --text-main: #ffffff;
            --text-muted: #666666;
            --text-dim: #a3a3a3;

            --accent-blue: #2979ff;
            --accent-cyan: #00e5ff;
            --accent-amber: #ff9100;
            --accent-red: #ff1744;
        }

        /* ⌚ CASIO LCD THEME */
        body[data-theme="lcd"] {
            --bg-base: #939d7a;
            --bg-surface: #848e6c;
            --bg-card: #8a9472;
            --bg-card-hover: #7c8665;
            --border-color: #464d37;
            --border-focus: #11140d;

            --text-main: #11140d;
            --text-muted: #464d37;
            --text-dim: #262b1e;

            --accent-blue: #1d2217;
            --accent-cyan: #0d100a;
            --accent-amber: #2b3122;
            --accent-red: #3b1c1c;
        }

        body[data-theme="lcd"] .btn-play-hero {
            background: #1a1f14;
            color: #939d7a;
            box-shadow: 2px 2px 0px #464d37;
            border: 1px solid #11140d;
        }
        body[data-theme="lcd"] .paragraph.active-text {
            background: rgba(17, 20, 13, 0.12);
            border-left: 4px solid #11140d;
        }
        body[data-theme="lcd"] .md-pre,
        body[data-theme="lcd"] .paragraph code {
            background: #7c8665;
            color: #11140d;
            border: 1px solid #464d37;
        }

        /* 🧮 MONO LCD THEME */
        body[data-theme="lcd-mono"] {
            --bg-base: #a3a8a3;
            --bg-surface: #949994;
            --bg-card: #9a9f9a;
            --bg-card-hover: #8b908b;
            --border-color: #4a4d4a;
            --border-focus: #121312;

            --text-main: #121312;
            --text-muted: #4a4d4a;
            --text-dim: #292b29;

            --accent-blue: #1f211f;
            --accent-cyan: #0d0e0d;
            --accent-amber: #2c2e2c;
            --accent-red: #381d1d;
        }

        body[data-theme="lcd-mono"] .btn-play-hero {
            background: #171817;
            color: #a3a8a3;
            box-shadow: 2px 2px 0px #4a4d4a;
            border: 1px solid #121312;
        }
        body[data-theme="lcd-mono"] .paragraph.active-text {
            background: rgba(18, 19, 18, 0.12);
            border-left: 4px solid #121312;
        }
        body[data-theme="lcd-mono"] .md-pre,
        body[data-theme="lcd-mono"] .paragraph code {
            background: #8b908b;
            color: #121312;
            border: 1px solid #4a4d4a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            transition: background 0.25s, color 0.25s;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* 1. TOP CONTROL BAR */
        .top-switch-bar {
            background: var(--bg-surface);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            z-index: 30;
            flex-shrink: 0;
        }

        .bar-left-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            padding-right: 4px;
        }

        .file-upload-badge {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 700;
            height: 34px;
            padding: 0 9px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
            max-width: 112px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .file-upload-badge input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer;
        }

        .modern-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            height: 34px;
            padding: 0 8px;
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Аккуратный селектор голоса — не наезжает на кнопку READ */
        #voiceSelect {
            flex: 0 1 130px;
            min-width: 74px;
            max-width: 135px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .icon-action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        .playback-controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 2px;
        }

        .btn-play-hero {
            background: linear-gradient(135deg, var(--accent-blue), #1d4ed8);
            border: none;
            color: #ffffff;
            height: 34px;
            padding: 0 13px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-pause-hero {
            background: linear-gradient(135deg, var(--accent-amber), #b45309);
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3);
            display: none;
        }
        .btn-stop-hero {
            background: linear-gradient(135deg, var(--accent-red), #991b1b);
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.3);
            display: none;
        }

        /* 2. READER SETTINGS SUB-BAR */
        .reader-settings-deck {
            background: var(--bg-surface);
            padding: 6px 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            position: relative;
            z-index: 25;
        }

        /* ВЕРТИКАЛЬНЫЙ ПОЛЗУНОК СКОРОСТИ (УВЕЛИЧЕНИЕ ВНИЗ + КНОПКА ЗАКРЫТЬ) */
        .speed-container {
            position: relative;
            display: inline-block;
        }
        .speed-popover {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 28px rgba(0,0,0,0.65);
            padding: 10px 8px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 120;
            width: 76px;
            touch-action: none;
        }
        .speed-popover.hidden {
            display: none;
        }
        .speed-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-cyan);
            text-align: center;
        }
        .speed-dir-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1;
        }
        /* Обёртка для вертикального слайдера (сверху 0.5x -> вниз 2.0x) */
        .v-slider-wrap {
            width: 36px;
            height: 136px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .v-slider-wrap input[type="range"] {
            width: 130px;
            height: 28px;
            margin: 0;
            transform: rotate(90deg);
            transform-origin: center;
            accent-color: var(--accent-cyan);
            cursor: pointer;
            touch-action: none;
        }

        /* ОБЪЕДИНЁННОЕ МЕНЮ ШРИФТА И РАЗМЕРА (Aa) */
        .font-menu-container {
            position: relative;
            display: inline-block;
        }
        .font-popover {
            position: absolute;
            top: 40px;
            left: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 28px rgba(0,0,0,0.65);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 120;
            width: 185px;
        }
        .font-popover.hidden {
            display: none;
        }
        .popover-section-label {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .font-family-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .font-choice-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: 0.15s;
        }
        .font-choice-btn:hover {
            background: var(--bg-card-hover);
        }
        .font-choice-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: var(--bg-card-hover);
            font-weight: 800;
        }
        .font-size-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }
        .font-size-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            min-width: 44px;
            text-align: center;
        }

        .popover-close-btn {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
            margin-top: 2px;
        }
        .popover-close-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-main);
            border-color: var(--border-focus);
        }

        .chunk-nav {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 18px;
            max-width: 540px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            color: var(--text-main);
        }
        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header-row h3 {
            margin: 0;
            font-size: 15px;
        }
        .modal-top-close {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-top-close:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
        .modal-box input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .modal-box input:focus { outline: none; border-color: var(--accent-cyan); }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 12px;
        }
        .modal-actions button {
            padding: 9px 15px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        .modal-actions .btn-cancel { background: #475569; color: #fff; }
        .modal-actions .btn-primary { background: var(--accent-cyan); color: var(--bg-base); }

        /* BOOKMARKS */
        .bookmark-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 9px 11px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            gap: 8px;
            background: var(--bg-card);
        }
        .bookmark-item .bm-text {
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }
        .bookmark-item .bm-name {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.3;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bookmark-item .bm-snippet {
            font-size: 11.5px;
            line-height: 1.35;
            color: var(--text-dim);
            margin-top: 3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .bookmark-item .bm-snippet.expanded {
            display: block;
            -webkit-line-clamp: unset;
            background: var(--bg-base);
            padding: 6px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-top: 6px;
            color: var(--text-main);
        }
        .bookmark-item .bm-meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }
        .bookmark-item .bm-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
            align-items: center;
        }
        .bookmark-item .bm-btn {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }
        .bookmark-item .bm-btn.delete { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }

        /* TABLE OF CONTENTS (TOC) */
        .toc-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 6px;
            background: var(--bg-card);
            cursor: pointer;
            transition: 0.15s;
            gap: 8px;
        }
        .toc-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-cyan);
        }
        .toc-item.active-toc {
            border-left: 4px solid var(--accent-cyan);
            background: var(--bg-card-hover);
        }
        .toc-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toc-lvl-1 { font-weight: 800; font-size: 13.5px; }
        .toc-lvl-2 { padding-left: 14px; font-weight: 600; }
        .toc-lvl-3 { padding-left: 28px; font-size: 12px; color: var(--text-dim); }
        .toc-lvl-4, .toc-lvl-5, .toc-lvl-6 { padding-left: 38px; font-size: 11.5px; color: var(--text-muted); }
        .toc-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* 3. TRACK & FILE INFO */
        .track-info-strip {
            padding: 4px 12px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .track-title-text {
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        /* 4. TEXT VIEWPORT */
        .content-viewport {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            padding: 20px 24px;
            font-family: var(--reader-font-family);
        }
        .content-viewport::-webkit-scrollbar { width: 6px; }
        .content-viewport::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .paragraph {
            margin-bottom: 1.4em;
            line-height: 1.75;
            font-size: var(--font-size);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-dim);
            transition: 0.15s ease;
            border-left: 3px solid transparent;
        }
        .paragraph:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }
        .paragraph.active-text {
            background: var(--bg-card);
            color: var(--text-main);
            border-left: 3px solid var(--accent-cyan);
        }

        /* ================= MARKDOWN ================= */
        .md-h1 { font-size: 1.8em; font-weight: 800; margin-top: 1.2em; line-height: 1.3; }
        .md-h2 { font-size: 1.5em; font-weight: 700; margin-top: 1.1em; line-height: 1.3; }
        .md-h3 { font-size: 1.3em; font-weight: 700; margin-top: 1.0em; }
        .md-h4, .md-h5, .md-h6 { font-size: 1.15em; font-weight: 700; margin-top: 0.8em; }

        .md-li {
            padding-left: 2em;
            position: relative;
        }
        .md-li::before {
            content: '•';
            position: absolute;
            left: 0.6em;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .md-quote {
            border-left: 4px solid var(--accent-cyan);
            padding-left: 1.2em;
            font-style: italic;
            color: var(--text-dim);
        }

        .md-pre {
            background: #1e2430;
            padding: 15px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre;
            color: #a0e8d0;
            cursor: default;
        }
        .md-pre:hover { background: #1e2430; color: #a0e8d0; }

        .md-hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.5em 0;
        }

        .paragraph strong { font-weight: 700; }
        .paragraph em { font-style: italic; }
        .paragraph del { text-decoration: line-through; opacity: 0.7; }
        .paragraph code {
            background: #1e2430;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: #a0e8d0;
        }

        .chunk-active {
            text-decoration: underline;
            text-decoration-color: var(--accent-cyan);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }
        .fb2-image {
            max-width: 85%;
            height: auto;
            border-radius: var(--radius-md);
            margin: 15px auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        /* 5. BOTTOM SHELF */
        .bottom-shelf {
            background: var(--bg-surface);
            padding: 6px 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            z-index: 20;
        }
        .shelf-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        .prefetch-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
            font-size: 10px;
        }
        .progress-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 7px;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: 700;
        }

        /* LOCK SCREEN OVERLAY */
        .lock-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(12, 14, 20, 0.96);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lock-overlay.hidden { display: none; }
        .unlock-pad {
            width: 260px;
            padding: 30px 20px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            color: var(--text-muted);
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .unlock-pad span:first-child {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-amber);
        }

        .paste-textarea {
            width: 100%;
            min-height: 220px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
            resize: vertical;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .paste-textarea:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        .paste-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .paste-tool-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .paste-tool-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-cyan);
        }

        audio { display: none; }
    </style>
</head>

    let lastRequestedUnitIndex = -1;
    let currentPlayingItem = null;

    let isFetching = false;
    let fetchAbortController = null;
    let fetchTimeoutId = null;

    let isPlaying = false;
    let isPaused = false;
    let bookKey = '';
    let currentSessionId = 0;
    let hasPendingJump = false;
    let observerBlocked = true;
    let userTouchScrolling = false;
    
    const PREFETCH_AHEAD = 6;
    const MAX_PLAYLIST = 12;
    const FETCH_TIMEOUT_MS = 30000;

    let timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
    const SAMPLE_SIZE = 5;

    // ================= WAKE LOCK =================
    let wakeLock = null;

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                if (isPlaying && !isPaused) {
                    setTimeout(requestWakeLock, 1000);
                }
            });
        } catch (e) {
            console.warn("⚠️ Wake Lock error:", e);
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    // ================= HARD PAUSE ON ERROR (NO CHUNK SKIPPING) =================
    function pauseOnError(reasonText) {
        console.warn("⏸ Paused due to error:", reasonText);
        releaseWakeLock();
        isPaused = true;
        audioPlayer.pause();

        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false;

        if (currentPlayingItem) {
            if (!playlist.length || playlist[0].unitIndex !== currentPlayingItem.unitIndex) {
                playlist.unshift(currentPlayingItem);
            }
            currentUnitIndex = currentPlayingItem.unitIndex;
        } else {
            lastRequestedUnitIndex = Math.max(currentUnitIndex - 1, -1);
        }

        playBtn.style.display = 'flex';
        pauseBtn.style.display = 'none';
        statusInfo.textContent = reasonText || `⚠️ Paused on chunk #${currentUnitIndex + 1}`;
        updateProgress();
    }

    // ================= AUDIO ERRORS =================
    audioPlayer.addEventListener('error', () => {
        const errCode = audioPlayer.error ? audioPlayer.error.code : '?';
        console.error(`❌ Audio error (code ${errCode}) on unit #${currentUnitIndex + 1}`);
        if (isPlaying && !isPaused) {
            if (currentPlayingItem && playlist.length && playlist[0].unitIndex === currentPlayingItem.unitIndex) {
                playlist.shift();
            }
            playlist = [];
            lastRequestedUnitIndex = currentUnitIndex - 1;
            currentPlayingItem = null;
            pauseOnError(`⚠️ Audio error on chunk #${currentUnitIndex + 1} (press Play)`);
        }
    });
    audioPlayer.addEventListener('stalled', () => console.warn("⚠️ Audio stalled"));
    audioPlayer.addEventListener('waiting', () => console.warn("⚠️ Audio waiting"));

    // ================= BACKGROUND RESUME =================
    document.addEventListener('visibilitychange', () => {
        console.log(`📱 visibilitychange: hidden=${document.hidden}, isPlaying=${isPlaying}, isPaused=${isPaused}, isFetching=${isFetching}`);
        if (!document.hidden && isPlaying && !isPaused) {
            setTimeout(() => {
                if (!wakeLock) requestWakeLock();
                if (audioPlayer.paused && isPlaying && !isPaused) {
                    if (audioPlayer.src && audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                        audioPlayer.play().catch(e => {
                            console.error("Resume play failed:", e);
                            pauseOnError(`⚠️ Paused on chunk #${currentUnitIndex + 1}`);
                        });
                    } else if (playlist.length > 0) {
                        playAudio();
                    } else if (!isFetching) {
                        fetchNext();
                    }
                }
            }, 400);
        }
    });

    // 1. Font Family Buttons (Inside Combined Aa Menu)
    let savedFont = localStorage.getItem('reader-font') || "'Lora', Georgia, serif";
    function applyFontFamily(fontVal) {
        savedFont = fontVal;
        document.documentElement.style.setProperty('--reader-font-family', fontVal);
        localStorage.setItem('reader-font', fontVal);
        fontFamilyButtons.forEach(btn => {

        });
    }
    applyFontFamily(savedFont);

    fontFamilyButtons.forEach(btn => {

    // 2. Playback Speed Preference (Vertical Slider: Top=0.5x, Bottom=2.0x)
    let currentPlaybackRate = parseFloat(localStorage.getItem('reader-speed')) || 1.0;
    if (currentPlaybackRate < 0.5) currentPlaybackRate = 0.5;
    if (currentPlaybackRate > 2.0) currentPlaybackRate = 2.0;

    function updateSpeedUI() {
        const txt = currentPlaybackRate.toFixed(2) + 'x';

    speedToggleBtn.onclick = (e) => {

    btnCloseSpeed.onclick = (e) => {

    speedRange.addEventListener('input', () => {

    // 3. Combined Font & Size Menu Controls

    function updateFontSize() {
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');

    document.getElementById('btnFontMinus').onclick = (e) => {

        currentFontSize = Math.max(12, currentFontSize - 2);

    };
    document.getElementById('btnFontPlus').onclick = (e) => {

    // Close popovers when clicking anywhere outside (including top bars)
    document.addEventListener('click', (e) => {
        if (!speedPopover.contains(e.target) && e.target !== speedToggleBtn) {
            speedPopover.classList.add('hidden');
        }
        if (!fontSizePopover.contains(e.target) && e.target !== fontSizeToggleBtn) {
            fontSizePopover.classList.add('hidden');
        }
    });

    // 4. Color Theme Selection
    const savedTheme = localStorage.getItem('reader-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    if (themeSelect) {
        themeSelect.value = savedTheme;
        themeSelect.addEventListener('change', () => {
            const theme = themeSelect.value;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('reader-theme', theme);
        });
    }

    // 5. Scroll Observation
    readerBody.addEventListener('touchmove', () => { userTouchScrolling = true; }, { passive: true });
    readerBody.addEventListener('wheel', () => { userTouchScrolling = true; }, { passive: true });

    const observer = new IntersectionObserver((entries) => {
        if (isPlaying || isPaused || observerBlocked || !userTouchScrolling) return;

        if (readerBody.scrollTop <= 30) {
            if (currentIndex !== 0) {
                currentIndex = 0;
                syncCurrentUnitFromParagraph();
                updateProgress();
                saveDebounced();
            }
            return;
        }

        const visibleIndices = entries
            .filter(e => e.isIntersecting)
            .map(e => parseInt(e.target.id.replace('p-', ''), 10))
            .filter(n => !isNaN(n));

        if (visibleIndices.length > 0) {
            const topVisibleIdx = Math.min(...visibleIndices);
            if (topVisibleIdx !== currentIndex) {
                currentIndex = topVisibleIdx;
                syncCurrentUnitFromParagraph();
                updateProgress();
                saveDebounced();
            }
        }
    }, { root: readerBody, rootMargin: '0px', threshold: 0.5 });

    // 6. File Upload & Parsing Handler
    document.getElementById('fb2File').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        stop();
        fileNameDisp.textContent = file.name;
        fileNameDisp.parentElement.title = file.name;
        deckBookTitle.textContent = file.name;
        bookKey = file.name; 
        const ext = file.name.split('.').pop().toLowerCase();
        deckFormatInfo.textContent = `${ext.toUpperCase()} • READY`;

        statusInfo.textContent = "Processing file...";
        readerBody.innerHTML = '<div style="text-align: center; margin-top: 60px; color: var(--text-muted); font-size:14px;">Parsing document...</div>';

        if (ext === 'fb2' || ext === 'xml') {
            const reader = new FileReader();
            reader.onload = (evt) => parseFB2(evt.target.result);
            reader.readAsText(file);
        } 
        else if (ext === 'txt') {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const txt = evt.target.result;
                const looksLikeMarkdown = /(^|\n)(#{1,6}\s|>\s|[-*]\s|\d+\.\s)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)/m.test(txt);
                if (looksLikeMarkdown) {
                    parseMD(txt);
                } else {
                    parseTXT(txt);
                }
            };
            reader.readAsText(file);
        }
        else if (['md', 'markdown', 'mdown', 'mkd'].includes(ext)) {
            const reader = new FileReader();
            reader.onload = (evt) => parseMD(evt.target.result);
            reader.readAsText(file);
        } 
        else if (ext === 'docx') {
            const reader = new FileReader();
            reader.onload = (evt) => parseDOCX(evt.target.result);
            reader.readAsArrayBuffer(file);
        }
        else if (ext === 'pdf') {
            const reader = new FileReader();
            reader.onload = (evt) => parsePDF(evt.target.result);
            reader.readAsArrayBuffer(file);
        }
        else {
            const reader = new FileReader();
            reader.onload = (evt) => parseMD(evt.target.result);
            reader.readAsText(file);
        }
    });

    async function parsePDF(arrayBuffer) {
        try {
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                let rawPageText = textContent.items.map(item => item.str).join(" ");
                rawPageText = rawPageText.replace(/\s+/g, ' ');
                fullText += rawPageText + " ";
            }
            let formattedText = fullText.replace(/([.?!])\s+([A-Za-zА-Яа-яЁё])/g, "$1\n$2");
            parseTXT(formattedText);
        } catch (err) {
            console.error(err);
            statusInfo.textContent = "PDF reading error";
        }
    }

    function parseFB2(xmlString) {
        const xml = new DOMParser().parseFromString(xmlString, "text/xml");
        const binaries = {};
        const binaryTags = xml.getElementsByTagName('binary');
        for(let i = 0; i < binaryTags.length; i++) {
            const id = binaryTags[i].getAttribute('id');
            const cType = binaryTags[i].getAttribute('content-type') || 'image/jpeg';
            const base64Data = binaryTags[i].textContent.replace(/\s+/g, '');
            binaries[id] = `data:${cType};base64,${base64Data}`;
        }

        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;
        const getHref = (node) => {
            for (let j = 0; j < node.attributes.length; j++) {
                if (node.attributes[j].name.includes('href')) return node.attributes[j].value;
            }
            return null;
        };

        const coverpages = xml.getElementsByTagName('coverpage');
        if (coverpages.length > 0) {
            const coverImages = coverpages[0].getElementsByTagName('image');
            for (let img of coverImages) {
                const href = getHref(img);
                if (href) {
                    const id = href.replace(/^#/, '');
                    if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                }
            }
        }

        const bodies = xml.getElementsByTagName('body');
        for (let b = 0; b < bodies.length; b++) {
            const walk = (node, inTitle = false) => {
                if (node.nodeType === 1) {
                    const tagName = node.tagName.replace(/^.*:/, '').toLowerCase();
                    if (tagName === 'title') {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i], true);
                    } else if (['p', 'v', 'subtitle', 'text-author'].includes(tagName)) {
                        const text = node.textContent.replace(/[*#]/g, '').trim();
                        if (text.length > 1) {
                            const isHeading = inTitle || tagName === 'subtitle';
                            const idx = pIndex++;
                            const block = {
                                type: 'text',
                                text: text,
                                className: isHeading ? (inTitle ? 'md-h2' : 'md-h3') : '',
                                index: idx
                            };
                            allBlocks.push(block);
                            textParagraphs.push(block);
                            if (isHeading) {
                                tocItems.push({
                                    title: text.slice(0, 90),
                                    level: inTitle ? 1 : 2,
                                    paragraphIndex: idx
                                });
                            }
                        }
                    } else if (tagName === 'image') {
                        const href = getHref(node);
                        if (href) {
                            const id = href.replace(/^#/, '');
                            if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                        }
                    } else {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i], inTitle);
                    }
                }
            };
            walk(bodies[b], false);
        }
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseMD(textString) {
        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;

        if (typeof marked === 'undefined') {
            return parseTXT(textString);
        }

        let html;
        try {
            html = marked.parse(textString, { breaks: true, gfm: true });
        } catch (e) {
            console.error("marked.parse failed:", e);
            return parseTXT(textString);
        }

        const container = document.createElement('div');
        container.innerHTML = html;

        container.querySelectorAll('a').forEach(a => {
            a.replaceWith(document.createTextNode(a.textContent));
        });

        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();

        const addTextBlock = (el, className, headingLevel = 0) => {
            const text = norm(el.textContent);
            if (!text) return;
            const idx = pIndex++;
            const block = {
                type: 'text',
                text: text,
                html: el.innerHTML,
                className: className || '',
                index: idx
            };
            allBlocks.push(block);
            textParagraphs.push(block);
            if (headingLevel > 0) {
                tocItems.push({
                    title: text,
                    level: headingLevel,
                    paragraphIndex: idx
                });
            }
        };

        for (const child of Array.from(container.children)) {
            const tag = child.tagName.toLowerCase();

            if (/^h[1-6]$/.test(tag)) {
                const lvl = parseInt(tag.substring(1), 10);
                addTextBlock(child, 'md-' + tag, lvl);
            } else if (tag === 'p') {
                addTextBlock(child, '');
            } else if (tag === 'ul' || tag === 'ol') {
                for (const li of Array.from(child.children)) {
                    if (li.tagName.toLowerCase() === 'li') {
                        addTextBlock(li, 'md-li');
                    }
                }
            } else if (tag === 'blockquote') {
                addTextBlock(child, 'md-quote');
            } else if (tag === 'pre') {
                const codeText = child.textContent || '';
                if (codeText.trim()) {
                    allBlocks.push({
                        type: 'code',
                        html: child.innerHTML,
                        text: codeText
                    });
                }
            } else if (tag === 'hr') {
                allBlocks.push({ type: 'hr' });
            } else {
                addTextBlock(child, '');
            }
        }

        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseTXT(textString) {
        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;
        const lines = textString.split(/\r?\n/);
        lines.forEach(line => {
            const raw = line.trim();
            if (raw.length > 1) {
                const mdMatch = raw.match(/^(#{1,6})\s+(.+)$/);
                const idx = pIndex++;
                if (mdMatch) {
                    const lvl = mdMatch[1].length;
                    const cleanTitle = mdMatch[2].trim();
                    const block = {
                        type: 'text',
                        text: cleanTitle,
                        className: 'md-h' + lvl,
                        index: idx
                    };
                    allBlocks.push(block);
                    textParagraphs.push(block);
                    tocItems.push({ title: cleanTitle, level: lvl, paragraphIndex: idx });
                } else {
                    const block = { type: 'text', text: raw, index: idx };
                    allBlocks.push(block);
                    textParagraphs.push(block);
                }
            }
        });
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseDOCX(arrayBuffer) {
        mammoth.convertToHtml({arrayBuffer: arrayBuffer})
            .then(function(result) {
                const htmlString = result.value; 
                const doc = new DOMParser().parseFromString(htmlString, "text/html");
                allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;

                const walk = (node) => {
                    if (node.nodeType === 1) { 
                        const tagName = node.tagName.toLowerCase();
                        if (tagName === 'img') {
                            const src = node.getAttribute('src');
                            if (src) allBlocks.push({ type: 'image', src: src });
                        } 
                        else if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li'].includes(tagName)) {
                            const text = node.textContent.trim();
                            if (text.length > 1) {
                                const idx = pIndex++;
                                const isH = /^h[1-6]$/.test(tagName);
                                const block = {
                                    type: 'text',
                                    text: text,
                                    className: isH ? ('md-' + tagName) : '',
                                    index: idx
                                };
                                allBlocks.push(block);
                                textParagraphs.push(block);
                                if (isH) {
                                    tocItems.push({
                                        title: text,
                                        level: parseInt(tagName.substring(1), 10),
                                        paragraphIndex: idx
                                    });
                                }
                            }
                        } else {
                            for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                        }
                    }
                };
                walk(doc.body);
                buildReadingUnitsServer().then(() => loadProgressAndRender());
            });
    }

    async function buildReadingUnitsServer() {
        readingUnits = [];
        let unitCounter = 0;
        statusInfo.textContent = "Splitting into sentences...";

        try {
            const rawParagraphs = textParagraphs.map(p => p.text);
            const res = await fetch('/api/split', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paragraphs: rawParagraphs })
            });
            const data = await res.json();

            if (data.results && data.results.length === textParagraphs.length) {
                for (let i = 0; i < textParagraphs.length; i++) {
                    const chunks = data.results[i];
                    for (const ch of chunks) {
                        readingUnits.push({
                            unitIndex: unitCounter++,
                            paragraphIndex: textParagraphs[i].index,
                            text: ch
                        });
                    }
                }
            } else {
                fallbackSplit(unitCounter);
            }
        } catch (e) {
            console.warn("Server split failed, fallback to raw paragraphs:", e);
            fallbackSplit(unitCounter);
        }
    }

    function fallbackSplit(unitCounter) {
        readingUnits = [];
        for (const p of textParagraphs) {
            readingUnits.push({
                unitIndex: unitCounter++,
                paragraphIndex: p.index,
                text: p.text
            });
        }
    }

    function syncCurrentUnitFromParagraph() {
        const found = readingUnits.findIndex(u => u.paragraphIndex >= currentIndex);
        currentUnitIndex = found !== -1 ? found : 0;
        lastRequestedUnitIndex = currentUnitIndex - 1;
    }

    function loadProgressAndRender() {
        observerBlocked = true;
        userTouchScrolling = false;
        fetch(`/load_progress?book_name=${encodeURIComponent(bookKey)}`)
            .then(r => r.json())
            .then(data => {
                currentIndex = data.index || 0;
                if (currentIndex >= textParagraphs.length || currentIndex < 0) currentIndex = 0;
                syncCurrentUnitFromParagraph();
                render();
            }).catch(() => { 
                currentIndex = 0; 
                syncCurrentUnitFromParagraph();
                render(); 
            });
    }

    function render() {
        observer.disconnect();
        observerBlocked = true;
        userTouchScrolling = false;
        readerBody.innerHTML = '';
        statusInfo.textContent = "Ready to read";

        allBlocks.forEach(block => {
            if (block.type === 'text') {
                const div = document.createElement('div');
                let cls = 'paragraph';
                if (block.className) cls += ' ' + block.className;
                div.className = cls;
                div.id = 'p-' + block.index;

                if (block.html) {
                    div.innerHTML = block.html;
                } else {
                    div.textContent = block.text;
                }

                div.onclick = () => { 
                    const sel = window.getSelection();
                    if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) {
                        return;
                    }
                    
                    currentIndex = block.index; 
                    syncCurrentUnitFromParagraph();
                    hasPendingJump = true;
                    saveDebounced(); 
                    
                    if(isPlaying) {
                        stop();
                        hasPendingJump = true;
                        setTimeout(() => { playBtn.click(); }, 120);
                    } else {
                        scrollToCurrent();
                    }
                };
                readerBody.appendChild(div);
            } else if (block.type === 'code') {
                const div = document.createElement('div');
                div.className = 'paragraph md-pre';
                div.innerHTML = block.html;
                readerBody.appendChild(div);
            } else if (block.type === 'hr') {
                const hr = document.createElement('hr');
                hr.className = 'md-hr';
                readerBody.appendChild(hr);
            } else if (block.type === 'image') {
                const img = document.createElement('img');
                img.src = block.src; img.className = 'fb2-image';
                readerBody.appendChild(img);
            }
        });
        updateProgress();
        setTimeout(scrollToCurrent, 100);
    }

    let saveTimeout;
    function saveDebounced() {
        updateProgress(); clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            fetch('/save_progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_name: bookKey, index: currentIndex })
            }).catch(err => console.error("Progress save failed:", err));
        }, 1000); 
    }

    function updateProgress() {
        if (textParagraphs.length > 0) {
            progressInfo.textContent = `${currentIndex + 1} / ${textParagraphs.length}`;
        }
        bufferInfo.textContent = `buf: ${playlist.length}/${PREFETCH_AHEAD}`;
    }

    function scrollToCurrent() {
        const el = document.getElementById('p-' + currentIndex);
        if(el) {
            document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
            el.classList.add('active-text');
            observer.disconnect();
            observerBlocked = true;

            if (currentIndex === 0) {
                readerBody.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const targetScrollTop = el.offsetTop - readerBody.offsetTop - (readerBody.clientHeight / 2) + (el.clientHeight / 2);
                readerBody.scrollTo({
                    top: Math.max(0, targetScrollTop),
                    behavior: 'smooth'
                });
            }

            setTimeout(() => {
                document.querySelectorAll('.paragraph').forEach(p => observer.observe(p));
                observerBlocked = false;
            }, 1200);
        }
    }

    function updateMediaSession(text) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'SileroRead',
                artist: text.length > 40 ? text.substring(0, 40) + '...' : text,
                album: bookKey || 'Audiobook'
            });
            
            navigator.mediaSession.setActionHandler('play', () => { if(isPaused) playBtn.click(); });
            navigator.mediaSession.setActionHandler('pause', () => { pauseBtn.click(); });
            navigator.mediaSession.setActionHandler('stop', () => { stopBtn.click(); });
            navigator.mediaSession.setActionHandler('previoustrack', () => { jumpToUnit(currentUnitIndex - 1); });
            navigator.mediaSession.setActionHandler('nexttrack', () => { jumpToUnit(currentUnitIndex + 1); });
        }
    }

    playBtn.onclick = () => {
        requestWakeLock();

        if (isPaused) {
            isPaused = false;
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            stopBtn.style.display = 'flex';
            statusInfo.textContent = "Playing...";

            if (audioPlayer.src && audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                audioPlayer.play().catch(e => {
                    console.warn("Resume failed, re-playing from queue:", e);
                    playAudio();
                });
            } else if (playlist.length > 0) {
                playAudio();
            } else {
                lastRequestedUnitIndex = currentUnitIndex - 1;
                fetchNext();
            }
            return;
        }

        if(!readingUnits.length) return;
        currentSessionId++; 
        isPlaying = true; 
        isPaused = false;
        playBtn.style.display = 'none'; 
        pauseBtn.style.display = 'flex';
        stopBtn.style.display = 'flex';
        
        playlist = [];
        currentPlayingItem = null;
        if (!hasPendingJump) {
            syncCurrentUnitFromParagraph();
        }
        hasPendingJump = false;
        console.log(`▶️ Start reading: paragraph=${currentIndex}, unit=${currentUnitIndex}/${readingUnits.length}`);
        statusInfo.textContent = "Buffering audio...";
        fetchNext();

    function stop() {
        releaseWakeLock();
        currentSessionId++; 
        isPlaying = false; 
        isPaused = false; 
        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false; 
        playlist = [];
        currentPlayingItem = null;
        lastRequestedUnitIndex = -1;
        audioPlayer.pause(); 
        audioPlayer.removeAttribute('src');
        playBtn.style.display = 'flex'; 
        pauseBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        statusInfo.textContent = "Stopped";
        clearChunkHighlight();
        timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
        updateTimeEstimate();
        updateProgress();

    // ================= CHUNK NAVIGATION (⏮ / ⏭ + HOLD 0.6s FOR START) =================
    function jumpToUnit(targetIndex) {
        if (!readingUnits.length) return;
        if (targetIndex < 0) targetIndex = 0;
        if (targetIndex >= readingUnits.length) targetIndex = readingUnits.length - 1;

        const wasPlaying = isPlaying && !isPaused;

        currentSessionId++;
        playlist = [];
        currentPlayingItem = null;
        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false;
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');

        currentUnitIndex = targetIndex;
        lastRequestedUnitIndex = targetIndex - 1;

        const item = readingUnits[targetIndex];
        if (item) {
            currentIndex = item.paragraphIndex;
            scrollToCurrent();
            highlightChunk(item.paragraphIndex, item.text);
            saveDebounced();
        }
        updateProgress();
        updateTimeEstimate();

        if (wasPlaying) {
            isPlaying = true;
            isPaused = false;
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            stopBtn.style.display = 'flex';
            statusInfo.textContent = `Chunk ${targetIndex + 1} / ${readingUnits.length}`;
            fetchNext();
        } else {
            isPlaying = false;
            isPaused = false;
            playBtn.style.display = 'flex';
            pauseBtn.style.display = 'none';
            stopBtn.style.display = 'none';
            statusInfo.textContent = `Chunk ${targetIndex + 1} / ${readingUnits.length}`;
            hasPendingJump = true;
        }
    }

    // ================= PREFETCH WITH 30s TIMEOUT & ERROR PAUSE =================
    function fetchNext() {
        if (!isPlaying || isFetching || isPaused) return;

        const nextTargetUnitIndex = Math.max(lastRequestedUnitIndex + 1, currentUnitIndex);

        if (nextTargetUnitIndex >= readingUnits.length) return;
        if (playlist.length >= MAX_PLAYLIST) return;
        if (playlist.length >= PREFETCH_AHEAD && !audioPlayer.paused) return;

        isFetching = true;
        lastRequestedUnitIndex = nextTargetUnitIndex;

        const item = readingUnits[nextTargetUnitIndex];
        const fetchSessionId = currentSessionId;

        const fd = new FormData();
        fd.append('text', item.text);
        fd.append('voice', voiceSelect.value);

        fetchAbortController = new AbortController();
        clearTimeout(fetchTimeoutId);
        fetchTimeoutId = setTimeout(() => {
            console.warn(`⏱ Fetch timeout (>30s) on unit #${nextTargetUnitIndex + 1}`);
            if (fetchAbortController) {
                try { fetchAbortController.abort(); } catch (_) {}
            }
        }, FETCH_TIMEOUT_MS);

        fetch('/synthesize', {
            method: 'POST',
            body: fd,
            signal: fetchAbortController.signal
        })
            .then(r => r.json())
            .then(data => {
                clearTimeout(fetchTimeoutId);
                isFetching = false;
                fetchAbortController = null;

                if (!isPlaying || fetchSessionId !== currentSessionId) return;

                if (data.success) {
                    playlist.push({ 
                        url: data.audio_url, 
                        paragraphIndex: item.paragraphIndex,
                        unitIndex: item.unitIndex,
                        text: item.text 
                    });
                    updateProgress();

                    if (audioPlayer.paused && playlist.length >= 1 && !isPaused) {
                        playAudio();
                    }
                    
                    fetchNext();
                } else {
                    console.error(`❌ Server synthesize error on unit #${item.unitIndex + 1}:`, data.error);
                    lastRequestedUnitIndex = item.unitIndex - 1;
                    if (playlist.length === 0 && audioPlayer.paused) {
                        pauseOnError(`⚠️ Synth error on chunk #${item.unitIndex + 1}`);
                    } else {
                        statusInfo.textContent = `⚠️ Prefetch error #${item.unitIndex + 1}`;
                    }
                }
            }).catch((err) => { 
                clearTimeout(fetchTimeoutId);
                isFetching = false;
                fetchAbortController = null;
                if (!isPlaying || fetchSessionId !== currentSessionId) return;

                console.warn(`⚠️ Network/Abort error on unit #${item.unitIndex + 1}:`, err);
                lastRequestedUnitIndex = item.unitIndex - 1;

                if (playlist.length === 0 && audioPlayer.paused) {
                    pauseOnError(`⚠️ Network timeout on chunk #${item.unitIndex + 1} (press Play)`);
                }
            });
    }

    // ================= CHUNK HIGHLIGHTING =================
    function findChunkRange(fullText, chunkText) {
        let idx = fullText.indexOf(chunkText);
        if (idx !== -1) return { start: idx, end: idx + chunkText.length };

        try {
            const escaped = chunkText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const flexible = escaped.replace(/\s+/g, '\\s+');
            const regex = new RegExp(flexible);
            const match = fullText.match(regex);
            if (match) {
                return { start: match.index, end: match.index + match[0].length };
            }
        } catch (e) {
            console.warn("Regex failed:", e);
        }
        return null;
    }

    function clearChunkHighlight() {
        document.querySelectorAll('.chunk-active').forEach(span => {
            const parent = span.parentNode;
            if (!parent) return;
            const textNode = document.createTextNode(span.textContent);
            parent.replaceChild(textNode, span);
            parent.normalize();
        });
    }

    function highlightChunk(paragraphIndex, chunkText) {
        clearChunkHighlight();

        const para = document.getElementById('p-' + paragraphIndex);
        if (!para) return;

        const walker = document.createTreeWalker(para, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let fullText = '';
        let n;
        while (n = walker.nextNode()) {
            nodes.push({ node: n, start: fullText.length });
            fullText += n.nodeValue;
        }

        const range = findChunkRange(fullText, chunkText);
        if (!range) return;

        const { start, end } = range;

        const pieces = [];
        for (const { node, start: nodeStart } of nodes) {
            const nodeLen = node.nodeValue.length;
            const nodeEnd = nodeStart + nodeLen;
            if (nodeEnd <= start || nodeStart >= end) continue;
            pieces.push({
                node: node,
                from: Math.max(0, start - nodeStart),
                to: Math.min(nodeLen, end - nodeStart)
            });
        }

        for (let i = pieces.length - 1; i >= 0; i--) {
            const { node, from, to } = pieces[i];
            const val = node.nodeValue;
            const before = val.substring(0, from);
            const middle = val.substring(from, to);
            const after = val.substring(to);

            const span = document.createElement('span');
            span.className = 'chunk-active';
            span.textContent = middle;

            const frag = document.createDocumentFragment();
            if (before) frag.appendChild(document.createTextNode(before));
            frag.appendChild(span);
            if (after) frag.appendChild(document.createTextNode(after));

            node.parentNode.replaceChild(frag, node);
        }

        const firstSpan = para.querySelector('.chunk-active');
        if (firstSpan) scrollToElementCenter(firstSpan);
    }

    function scrollToElementCenter(el) {
        const rect = el.getBoundingClientRect();
        const bodyRect = readerBody.getBoundingClientRect();
        const elTopInBody = rect.top - bodyRect.top + readerBody.scrollTop;
        const targetScrollTop = elTopInBody - (readerBody.clientHeight / 2) + (rect.height / 2);

        readerBody.scrollTo({
            top: Math.max(0, targetScrollTop),
            behavior: 'smooth'
        });
    }

    function playAudio() {
        if (!isPlaying || !playlist.length || isPaused) return;
        
        const audioItem = playlist.shift();
        currentPlayingItem = audioItem;
        currentUnitIndex = audioItem.unitIndex;
        
        if (currentIndex !== audioItem.paragraphIndex) {
            currentIndex = audioItem.paragraphIndex;
            saveDebounced();
        }
        
        highlightChunk(audioItem.paragraphIndex, audioItem.text);
        document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
        const activePara = document.getElementById('p-' + audioItem.paragraphIndex);
        if (activePara) activePara.classList.add('active-text');
        
        updateProgress();
        updateMediaSession(audioItem.text);
        
        statusInfo.textContent = "Speaking...";
        audioPlayer.src = audioItem.url;
        audioPlayer.playbackRate = currentPlaybackRate;
        
        audioPlayer.play().catch(e => {
            console.error("❌ Playback prevented or failed:", e);
            pauseOnError(`⚠️ Press Play (chunk #${audioItem.unitIndex + 1})`);
        });

        const onMeta = () => {
            const dur = audioPlayer.duration;
            if (isFinite(dur) && dur > 0 && timingStats.sampleCount < SAMPLE_SIZE) {
                timingStats.totalChars += audioItem.text.length;
                timingStats.totalDuration += dur;
                timingStats.sampleCount++;
                updateTimeEstimate();
            }
            audioPlayer.removeEventListener('loadedmetadata', onMeta);
        };
        audioPlayer.addEventListener('loadedmetadata', onMeta);
        updateTimeEstimate();

        fetchNext();
    }

    audioPlayer.onended = () => {
        currentPlayingItem = null;
        if (isPlaying && !isPaused) {
            if (playlist.length > 0) {
                playAudio();
            } else if (lastRequestedUnitIndex + 1 < readingUnits.length) {
                statusInfo.textContent = "Buffering next...";
                fetchNext();
            } else {
                stop();
                statusInfo.textContent = "Finished reading";
            }
        }
    };

    // ================= TIME ESTIMATE =================
    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '--';
        if (sec < 60) return Math.round(sec) + 's';
        if (sec < 3600) return Math.round(sec / 60) + 'm';
        const h = Math.floor(sec / 3600);
        const m = Math.round((sec % 3600) / 60);
        return h + 'h ' + m + 'm';
    }

    function updateTimeEstimate() {
        const timeInfo = document.getElementById('timeInfo');
        if (!timeInfo) return;
        if (timingStats.sampleCount < 1 || !readingUnits.length) {
            timeInfo.textContent = '⏱ --';
            return;
        }
        const charsPerSec = timingStats.totalChars / timingStats.totalDuration;
        if (!isFinite(charsPerSec) || charsPerSec <= 0) {
            timeInfo.textContent = '⏱ --';
            return;
        }
        let remainingChars = 0;
        for (let i = currentUnitIndex; i < readingUnits.length; i++) {
            remainingChars += readingUnits[i].text.length;
        }
        const remainingSec = remainingChars / charsPerSec / currentPlaybackRate;
        timeInfo.textContent = '⏱ ~' + formatTime(remainingSec);
    }

    // ================= TABLE OF CONTENTS (TOC) =================
    function openTocModal() {
        if (!textParagraphs.length) {

        const list = document.getElementById('tocList');
        if (!tocItems.length) {

        } else {
            let activeTocIdx = -1;
            for (let i = 0; i < tocItems.length; i++) {
                if (tocItems[i].paragraphIndex <= currentIndex) {
                    activeTocIdx = i;
                } else {
                    break;
                }
            }

            list.innerHTML = tocItems.map((item, idx) => `
                <div class="toc-item ${idx === activeTocIdx ? 'active-toc' : ''}" onclick="jumpToHeading(${item.paragraphIndex})">
                    <div class="toc-title toc-lvl-${item.level}" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
                    <span class="toc-badge">¶ ${item.paragraphIndex + 1}</span>

            `).join('');
        }

    }

    function jumpToHeading(paragraphIdx) {
        closeTocModal();
        const targetUnit = readingUnits.findIndex(u => u.paragraphIndex >= paragraphIdx);
        if (targetUnit !== -1) {
            jumpToUnit(targetUnit);
        } else {
            currentIndex = paragraphIdx;
            scrollToCurrent();
            saveDebounced();
        }
    }

                const end = pastedTextInput.selectionEnd;
                const current = pastedTextInput.value;
                pastedTextInput.value = current.slice(0, start) + clipText + current.slice(end);

        stop();

        let hash = 0;
        for (let i = 0; i < rawText.length; i++) {
            hash = ((hash << 5) - hash) + rawText.charCodeAt(i);
            hash |= 0;
        }
        const firstLine = rawText.split(/\r?\n/)[0].replace(/[#>*_`~]/g, '').trim().slice(0, 28) || 'Pasted Text';
        bookKey = `pasted_${Math.abs(hash)}`;

        fileNameDisp.textContent = 'Clipboard';
        deckBookTitle.textContent = `📋 ${firstLine}`;
        deckFormatInfo.textContent = 'TEXT/MD • READY';
        statusInfo.textContent = 'Processing text...';

        const looksLikeMarkdown = /(^|\n)(#{1,6}\s|>\s|[-*]\s|\d+\.\s)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)/m.test(rawText);
        if (looksLikeMarkdown) {
            parseMD(rawText);
        } else {
            parseTXT(rawText);
        }
    });

    // 8. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .catch(err => console.log('SW registration error:', err));
        });
    }
</script>
</body>
</html>
