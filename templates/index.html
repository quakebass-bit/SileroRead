<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SileroRead • Stream Deck</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0c0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SileroRead">
    <link rel="icon" type="image/png" href="/static/icon.png">
    <link rel="apple-touch-icon" href="/static/icon.png">
    
    <!-- UI & Reading Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    
    <style>
        :root, body[data-theme="dark"] {
            --bg-base: #0c0e14;
            --bg-surface: #141721;
            --bg-card: #1b1f2e;
            --bg-card-hover: #22273a;
            --border-color: #262c40;
            --border-focus: #3b82f6;

            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --text-dim: #94a3b8;

            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;

            --font-size: 19px;
            --reader-font-family: 'Lora', Georgia, serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 18px;
        }

        body[data-theme="light"] {
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
            --bg-card: #f1f5f9;
            --bg-card-hover: #e2e8f0;
            --border-color: #cbd5e1;
            --border-focus: #2563eb;

            --text-main: #0f172a;
            --text-muted: #94a3b8;
            --text-dim: #334155;

            --accent-blue: #2563eb;
            --accent-cyan: #0891b2;
            --accent-amber: #d97706;
            --accent-red: #dc2626;
        }

        body[data-theme="sepia"] {
            --bg-base: #f4ecd8;
            --bg-surface: #ebdcb9;
            --bg-card: #e4d3a8;
            --bg-card-hover: #dbbe8f;
            --border-color: #d1b88a;
            --border-focus: #8b5a2b;

            --text-main: #433422;
            --text-muted: #7f6a52;
            --text-dim: #5c4b37;

            --accent-blue: #8b5a2b;
            --accent-cyan: #7c4b1d;
            --accent-amber: #b26a00;
            --accent-red: #9e2a2b;
        }

        body[data-theme="oled"] {
            --bg-base: #000000;
            --bg-surface: #0a0a0a;
            --bg-card: #121212;
            --bg-card-hover: #1c1c1c;
            --border-color: #262626;
            --border-focus: #00e5ff;

            --text-main: #ffffff;
            --text-muted: #666666;
            --text-dim: #a3a3a3;

            --accent-blue: #2979ff;
            --accent-cyan: #00e5ff;
            --accent-amber: #ff9100;
            --accent-red: #ff1744;
        }

        body[data-theme="lcd"] {
            --bg-base: #939d7a;
            --bg-surface: #848e6c;
            --bg-card: #8a9472;
            --bg-card-hover: #7c8665;
            --border-color: #464d37;
            --border-focus: #11140d;

            --text-main: #11140d;
            --text-muted: #464d37;
            --text-dim: #262b1e;

            --accent-blue: #1d2217;
            --accent-cyan: #0d100a;
            --accent-amber: #2b3122;
            --accent-red: #3b1c1c;
        }

        body[data-theme="lcd-mono"] {
            --bg-base: #a3a8a3;
            --bg-surface: #949994;
            --bg-card: #9a9f9a;
            --bg-card-hover: #8b908b;
            --border-color: #4a4d4a;
            --border-focus: #121312;

            --text-main: #121312;
            --text-muted: #4a4d4a;
            --text-dim: #292b29;

            --accent-blue: #1f211f;
            --accent-cyan: #0d0e0d;
            --accent-amber: #2c2e2c;
            --accent-red: #381d1d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            transition: background 0.25s, color 0.25s;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        /* 1. TOP CONTROL BAR (LINE 1) */
        .top-switch-bar {
            background: var(--bg-surface);
            padding: 6px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            z-index: 30;
            flex-shrink: 0;
            min-height: 46px;
        }

        .bar-left-cluster {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
        }

        .file-upload-badge {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--accent-cyan);
            font-size: 12px;
            font-weight: 700;
            height: 34px;
            padding: 0 9px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: 0.2s;
            max-width: 110px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-shrink: 0;
        }
        .file-upload-badge input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0; width: 100%; height: 100%;
            cursor: pointer;
        }

        .modern-select {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            height: 34px;
            padding: 0 8px;
            border-radius: var(--radius-sm);
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
        }

        #voiceSelect {
            flex: 0 1 125px;
            min-width: 70px;
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .icon-action-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 34px;
            padding: 0 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        .icon-action-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-focus);
        }

        .playback-controls-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-play-hero {
            background: linear-gradient(135deg, var(--accent-blue), #1d4ed8);
            border: none;
            color: #ffffff;
            height: 34px;
            padding: 0 12px;
            border-radius: var(--radius-sm);
            font-size: 12.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn-pause-hero {
            background: linear-gradient(135deg, var(--accent-amber), #b45309);
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.3);
            display: none;
        }
        .btn-stop-hero {
            background: linear-gradient(135deg, var(--accent-red), #991b1b);
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.3);
            display: none;
        }

        /* 2. SUB-BAR (LINE 2): THEME, SPEED, FONT, TOC, BOOKMARKS, LOCK */
        .reader-settings-deck {
            background: var(--bg-surface);
            padding: 5px 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            position: relative;
            z-index: 25;
            min-height: 44px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .reader-settings-deck::-webkit-scrollbar { display: none; }

        /* SPEED POPOVER */
        .speed-container {
            position: relative;
            display: inline-block;
        }
        .speed-popover {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 28px rgba(0,0,0,0.65);
            padding: 10px 8px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 120;
            width: 76px;
            touch-action: none;
        }
        .speed-popover.hidden { display: none; }
        .speed-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent-cyan);
            text-align: center;
        }
        .speed-dir-hint {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1;
        }
        .v-slider-wrap {
            width: 36px;
            height: 136px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .v-slider-wrap input[type="range"] {
            width: 130px;
            height: 28px;
            margin: 0;
            transform: rotate(90deg);
            transform-origin: center;
            accent-color: var(--accent-cyan);
            cursor: pointer;
            touch-action: none;
        }

        /* FONT POPOVER */
        .font-menu-container {
            position: relative;
            display: inline-block;
        }
        .font-popover {
            position: absolute;
            top: 40px;
            left: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 28px rgba(0,0,0,0.65);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 120;
            width: 185px;
        }
        .font-popover.hidden { display: none; }
        .popover-section-label {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .font-family-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .font-choice-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: 0.15s;
        }
        .font-choice-btn:hover { background: var(--bg-card-hover); }
        .font-choice-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background: var(--bg-card-hover);
            font-weight: 800;
        }
        .font-size-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }
        .font-size-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
            min-width: 44px;
            text-align: center;
        }
        .popover-close-btn {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-dim);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            text-align: center;
            transition: 0.15s;
            margin-top: 2px;
        }
        .popover-close-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-main);
            border-color: var(--border-focus);
        }

        /* 3. TRACK & FILE INFO */
        .track-info-strip {
            padding: 4px 12px;
            background: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .track-title-text {
            font-weight: 700;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        /* 4. TEXT VIEWPORT */
        .content-viewport {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            padding: 20px 24px 100px 24px;
            font-family: var(--reader-font-family);
        }
        .content-viewport::-webkit-scrollbar { width: 6px; }
        .content-viewport::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .paragraph {
            margin-bottom: 1.4em;
            line-height: 1.75;
            font-size: var(--font-size);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            color: var(--text-dim);
            transition: 0.15s ease;
            border-left: 3px solid transparent;
        }
        .paragraph:hover {
            background: var(--bg-card);
            color: var(--text-main);
        }
        .paragraph.active-text {
            background: var(--bg-card);
            color: var(--text-main);
            border-left: 3px solid var(--accent-cyan);
        }

        .md-h1 { font-size: 1.8em; font-weight: 800; margin-top: 1.2em; line-height: 1.3; }
        .md-h2 { font-size: 1.5em; font-weight: 700; margin-top: 1.1em; line-height: 1.3; }
        .md-h3 { font-size: 1.3em; font-weight: 700; margin-top: 1.0em; }
        .md-h4, .md-h5, .md-h6 { font-size: 1.15em; font-weight: 700; margin-top: 0.8em; }

        .md-li {
            padding-left: 2em;
            position: relative;
        }
        .md-li::before {
            content: '•';
            position: absolute;
            left: 0.6em;
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .md-quote {
            border-left: 4px solid var(--accent-cyan);
            padding-left: 1.2em;
            font-style: italic;
            color: var(--text-dim);
        }

        .md-pre {
            background: #1e2430;
            padding: 15px 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre;
            color: #a0e8d0;
            cursor: default;
        }

        .md-hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 1.5em 0;
        }

        .paragraph strong { font-weight: 700; }
        .paragraph em { font-style: italic; }
        .paragraph del { text-decoration: line-through; opacity: 0.7; }
        .paragraph code {
            background: #1e2430;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            color: #a0e8d0;
        }

        .chunk-active {
            text-decoration: underline;
            text-decoration-color: var(--accent-cyan);
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }
        .fb2-image {
            max-width: 85%;
            height: auto;
            border-radius: var(--radius-md);
            margin: 15px auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        /* 5. BOTTOM SHELF */
        .bottom-shelf {
            background: var(--bg-surface);
            padding: 6px 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            flex-shrink: 0;
            z-index: 20;
        }
        .shelf-status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        .prefetch-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
            font-size: 10px;
        }
        .progress-badge {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2px 7px;
            border-radius: 6px;
            color: var(--text-main);
            font-weight: 700;
        }

        /* 🎛️ FLOATING CHUNK CONTROLLER (СВОБОДНО ПЕРЕМЕЩАЕМЫЙ ПУЛЬТ) */
        .floating-chunk-pad {
            position: absolute;
            left: 50%;
            top: 76%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: center;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
            border-radius: 40px;
            padding: 5px;
            gap: 5px;
            z-index: 45;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            backdrop-filter: blur(8px);
            transition: opacity 0.25s ease, box-shadow 0.25s ease;
        }
        .floating-chunk-pad.reading-mode {
            opacity: 0.75;
        }
        .floating-chunk-pad.reading-mode:hover,
        .floating-chunk-pad.reading-mode:active {
            opacity: 1;
        }
        .floating-chunk-pad.unlocked {
            border-color: var(--accent-amber);
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
        }

        .floating-lock-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 40px;
            height: 44px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .floating-chunk-pad.unlocked .floating-lock-btn {
            background: var(--accent-amber);
            color: #0c0e14;
            border-color: var(--accent-amber);
            font-weight: 800;
        }

        .drag-handle-pill {
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--accent-amber);
            font-size: 14px;
            font-weight: 800;
            padding: 0 4px;
            cursor: grab;
            letter-spacing: -2px;
        }
        .floating-chunk-pad.unlocked .drag-handle-pill {
            display: flex;
        }

        .floating-nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            height: 44px;
            min-width: 58px;
            padding: 0 16px;
            border-radius: 28px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .floating-nav-btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .floating-nav-btn:active {
            transform: scale(0.94);
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 99998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 18px;
            max-width: 540px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            color: var(--text-main);
        }
        .modal-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header-row h3 { margin: 0; font-size: 15px; }
        .modal-top-close {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .modal-top-close:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
        .modal-box input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .modal-box input:focus { outline: none; border-color: var(--accent-cyan); }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 12px;
        }
        .modal-actions button {
            padding: 9px 15px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }
        .modal-actions .btn-cancel { background: #475569; color: #fff; }
        .modal-actions .btn-primary { background: var(--accent-cyan); color: var(--bg-base); }

        /* BOOKMARKS */
        .bookmark-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 9px 11px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            gap: 8px;
            background: var(--bg-card);
        }
        .bookmark-item .bm-text { flex: 1; overflow: hidden; min-width: 0; }
        .bookmark-item .bm-name {
            font-size: 13px; font-weight: 700; line-height: 1.3;
            color: var(--text-main); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .bookmark-item .bm-snippet {
            font-size: 11.5px; line-height: 1.35; color: var(--text-dim); margin-top: 3px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; word-break: break-word;
        }
        .bookmark-item .bm-snippet.expanded {
            display: block; -webkit-line-clamp: unset; background: var(--bg-base);
            padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border-color);
            margin-top: 6px; color: var(--text-main);
        }
        .bookmark-item .bm-meta {
            font-size: 10px; color: var(--text-muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace;
        }
        .bookmark-item .bm-actions { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
        .bookmark-item .bm-btn {
            padding: 5px 8px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border-color);
            background: var(--bg-surface); color: var(--text-main); cursor: pointer; flex-shrink: 0;
        }
        .bookmark-item .bm-btn.delete { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }

        /* TABLE OF CONTENTS (TOC) */
        .toc-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 6px;
            margin-bottom: 6px; background: var(--bg-card); cursor: pointer; transition: 0.15s; gap: 8px;
        }
        .toc-item:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }
        .toc-item.active-toc { border-left: 4px solid var(--accent-cyan); background: var(--bg-card-hover); }
        .toc-title { font-size: 13px; font-weight: 600; color: var(--text-main); line-height: 1.3; flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .toc-lvl-1 { font-weight: 800; font-size: 13.5px; }
        .toc-lvl-2 { padding-left: 14px; font-weight: 600; }
        .toc-lvl-3 { padding-left: 28px; font-size: 12px; color: var(--text-dim); }
        .toc-lvl-4, .toc-lvl-5, .toc-lvl-6 { padding-left: 38px; font-size: 11.5px; color: var(--text-muted); }
        .toc-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }

        /* LOCK SCREEN OVERLAY */
        .lock-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(12, 14, 20, 0.96);
            backdrop-filter: blur(10px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .lock-overlay.hidden { display: none; }
        .unlock-pad {
            width: 260px;
            padding: 30px 20px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            color: var(--text-muted);
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .unlock-pad span:first-child {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent-amber);
        }

        .paste-textarea {
            width: 100%;
            min-height: 220px;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            padding: 12px;
            resize: vertical;
            margin-bottom: 12px;
            box-sizing: border-box;
        }
        .paste-textarea:focus { outline: none; border-color: var(--accent-cyan); }
        .paste-toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .paste-tool-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .paste-tool-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-cyan); }

        audio { display: none; }
    </style>
</head>
<body>

<div class="app-shell" id="appShell">

<script>
    const playBtn = document.getElementById('playBtn'), stopBtn = document.getElementById('stopBtn'), pauseBtn = document.getElementById('pauseBtn');
    const readerBody = document.getElementById('readerBody'), voiceSelect = document.getElementById('voiceSelect');
    const audioPlayer = document.getElementById('audioPlayer'), statusInfo = document.getElementById('statusInfo');
    const bufferInfo = document.getElementById('bufferInfo');
    const progressInfo = document.getElementById('progressInfo'), fileNameDisp = document.getElementById('fileNameDisp');
    const deckBookTitle = document.getElementById('deck-book-title'), deckFormatInfo = document.getElementById('deck-format-info');
    
    const speedToggleBtn = document.getElementById('speedToggleBtn');
    const speedPopover = document.getElementById('speedPopover');
    const speedRange = document.getElementById('speedRange');
    const speedBtnText = document.getElementById('speedBtnText');
    const speedDisp = document.getElementById('speedDisp');
    const btnCloseSpeed = document.getElementById('btnCloseSpeed');

    const fontSizeToggleBtn = document.getElementById('fontSizeToggleBtn');
    const fontSizePopover = document.getElementById('fontSizePopover');
    const fontSizeBtnText = document.getElementById('fontSizeBtnText');
    const fontSizeDisp = document.getElementById('fontSizeDisp');
    const fontFamilyButtons = document.querySelectorAll('.font-choice-btn');
    const btnCloseFont = document.getElementById('btnCloseFont');
    const themeSelect = document.getElementById('themeSelect');

    let allBlocks = []; 
    let textParagraphs = []; 
    let tocItems = []; 
    let currentIndex = 0;
    
    let readingUnits = []; 
    let currentUnitIndex = 0;

    let playlist = []; 
    let lastRequestedUnitIndex = -1;
    let currentPlayingItem = null;

    let isFetching = false;
    let fetchAbortController = null;
    let fetchTimeoutId = null;

    let isPlaying = false;
    let isPaused = false;
    let bookKey = '';
    let currentSessionId = 0;
    let hasPendingJump = false;
    let observerBlocked = true;
    let userTouchScrolling = false;
    
    const PREFETCH_AHEAD = 6;
    const MAX_PLAYLIST = 12;
    const FETCH_TIMEOUT_MS = 30000;

    let timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
    const SAMPLE_SIZE = 5;

    // ================= WAKE LOCK =================
    let wakeLock = null;

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                if (isPlaying && !isPaused) setTimeout(requestWakeLock, 1000);
            });
        } catch (e) {
            console.warn("⚠️ Wake Lock error:", e);
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    // ================= HARD PAUSE ON ERROR =================
    function pauseOnError(reasonText) {
        releaseWakeLock();
        isPaused = true;
        audioPlayer.pause();

        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false;

        if (currentPlayingItem) {
            if (!playlist.length || playlist[0].unitIndex !== currentPlayingItem.unitIndex) {
                playlist.unshift(currentPlayingItem);
            }
            currentUnitIndex = currentPlayingItem.unitIndex;
        } else {
            lastRequestedUnitIndex = Math.max(currentUnitIndex - 1, -1);
        }

        playBtn.style.display = 'flex';
        pauseBtn.style.display = 'none';
        floatingPad.classList.remove('reading-mode');
        statusInfo.textContent = reasonText || `⚠️ Paused on chunk #${currentUnitIndex + 1}`;
        updateProgress();
    }

    audioPlayer.addEventListener('error', () => {
        const errCode = audioPlayer.error ? audioPlayer.error.code : '?';
        if (isPlaying && !isPaused) {
            if (currentPlayingItem && playlist.length && playlist[0].unitIndex === currentPlayingItem.unitIndex) {
                playlist.shift();
            }
            playlist = [];
            lastRequestedUnitIndex = currentUnitIndex - 1;
            currentPlayingItem = null;
            pauseOnError(`⚠️ Audio error on chunk #${currentUnitIndex + 1} (press Play)`);
        }
    });

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isPlaying && !isPaused) {
            setTimeout(() => {
                if (!wakeLock) requestWakeLock();
                if (audioPlayer.paused && isPlaying && !isPaused) {
                    if (audioPlayer.src && audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                        audioPlayer.play().catch(e => pauseOnError(`⚠️ Paused on chunk #${currentUnitIndex + 1}`));
                    } else if (playlist.length > 0) {
                        playAudio();
                    } else if (!isFetching) {
                        fetchNext();
                    }
                }
            }, 400);
        }
    });

    // ================= DRAGGABLE / FLOATING CHUNK CONTROLLER =================
    const floatingPad = document.getElementById('floatingChunkPad');
    const padLockBtn = document.getElementById('padLockBtn');
    let isPadUnlocked = false;
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    let padStartLeft = 0, padStartTop = 0;

    // Загрузка сохранённого положения
    const savedPadPos = localStorage.getItem('silero-chunk-pad-pos');
    if (savedPadPos) {
        try {
            const { x, y } = JSON.parse(savedPadPos);
            floatingPad.style.left = x + 'px';
            floatingPad.style.top = y + 'px';
            floatingPad.style.transform = 'none';
        } catch (_) {}
    }

    padLockBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isPadUnlocked = !isPadUnlocked;
        floatingPad.classList.toggle('unlocked', isPadUnlocked);
        padLockBtn.textContent = isPadUnlocked ? '🔓' : '🔒';
        padLockBtn.title = isPadUnlocked ? 'Pad is UNLOCKED (Drag to move)' : 'Pad is LOCKED (Click to move)';
        if (isPadUnlocked && navigator.vibrate) navigator.vibrate(30);
    });

    function startPadDrag(clientX, clientY) {
        if (!isPadUnlocked) return;
        isDragging = true;
        const rect = floatingPad.getBoundingClientRect();
        
        // Переход с transform(-50%, -50%) на абсолютные пиксели
        floatingPad.style.transform = 'none';
        floatingPad.style.left = rect.left + 'px';
        floatingPad.style.top = rect.top + 'px';

        dragStartX = clientX;
        dragStartY = clientY;
        padStartLeft = rect.left;
        padStartTop = rect.top;
    }

    function movePadDrag(clientX, clientY) {
        if (!isDragging) return;
        const dx = clientX - dragStartX;
        const dy = clientY - dragStartY;

        let newLeft = padStartLeft + dx;
        let newTop = padStartTop + dy;

        const maxLeft = window.innerWidth - floatingPad.offsetWidth - 8;
        const maxTop = window.innerHeight - floatingPad.offsetHeight - 8;

        newLeft = Math.max(8, Math.min(newLeft, maxLeft));
        newTop = Math.max(50, Math.min(newTop, maxTop));

        floatingPad.style.left = newLeft + 'px';
        floatingPad.style.top = newTop + 'px';
    }

    function endPadDrag() {
        if (!isDragging) return;
        isDragging = false;
        const rect = floatingPad.getBoundingClientRect();
        localStorage.setItem('silero-chunk-pad-pos', JSON.stringify({ x: rect.left, y: rect.top }));
    }

    floatingPad.addEventListener('mousedown', (e) => {
        if (isPadUnlocked && (e.target === floatingPad || e.target.id === 'padDragHandle')) {
            startPadDrag(e.clientX, e.clientY);
        }
    });
    window.addEventListener('mousemove', (e) => {
        if (isDragging) movePadDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', endPadDrag);

    floatingPad.addEventListener('touchstart', (e) => {
        if (isPadUnlocked && (e.target === floatingPad || e.target.id === 'padDragHandle')) {
            const t = e.touches[0];
            startPadDrag(t.clientX, t.clientY);
        }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length > 0) {
            const t = e.touches[0];
            movePadDrag(t.clientX, t.clientY);
        }
    }, { passive: true });
    window.addEventListener('touchend', endPadDrag);

    // ================= FONT / THEME / SPEED =================
    let savedFont = localStorage.getItem('reader-font') || "'Lora', Georgia, serif";
    function applyFontFamily(fontVal) {
        savedFont = fontVal;
        document.documentElement.style.setProperty('--reader-font-family', fontVal);
        localStorage.setItem('reader-font', fontVal);
        fontFamilyButtons.forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-font') === fontVal);
        });
    }
    applyFontFamily(savedFont);

    fontFamilyButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            applyFontFamily(btn.getAttribute('data-font'));
        });
    });

    let currentPlaybackRate = parseFloat(localStorage.getItem('reader-speed')) || 1.0;
    if (currentPlaybackRate < 0.5) currentPlaybackRate = 0.5;
    if (currentPlaybackRate > 2.0) currentPlaybackRate = 2.0;

    function updateSpeedUI() {
        const txt = currentPlaybackRate.toFixed(2) + 'x';
        speedRange.value = currentPlaybackRate.toString();
        speedBtnText.textContent = txt;
        speedDisp.textContent = txt;
        audioPlayer.playbackRate = currentPlaybackRate;
    }
    updateSpeedUI();

    speedToggleBtn.onclick = (e) => {
        e.stopPropagation();
        fontSizePopover.classList.add('hidden');
        speedPopover.classList.toggle('hidden');
