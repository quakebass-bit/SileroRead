    speedPopover.addEventListener('click', (e) => e.stopPropagation());
    btnCloseSpeed.onclick = (e) => {
        e.stopPropagation();
        speedPopover.classList.add('hidden');
    };
    speedRange.addEventListener('input', () => {
        currentPlaybackRate = parseFloat(speedRange.value);
        updateSpeedUI();
    });
    speedRange.addEventListener('change', () => {
        localStorage.setItem('reader-speed', currentPlaybackRate);
        updateTimeEstimate();
    });

    let currentFontSize = parseInt(localStorage.getItem('reader-font-size')) || 19;
    function updateFontSize() {
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        fontSizeBtnText.textContent = `[${currentFontSize}px]`;
        fontSizeDisp.textContent = currentFontSize + 'px';
        localStorage.setItem('reader-font-size', currentFontSize);
    }
    updateFontSize();

    fontSizeToggleBtn.onclick = (e) => {
        e.stopPropagation();
        speedPopover.classList.add('hidden');
        fontSizePopover.classList.toggle('hidden');
    };
    fontSizePopover.addEventListener('click', (e) => e.stopPropagation());
    btnCloseFont.onclick = (e) => {
        e.stopPropagation();
        fontSizePopover.classList.add('hidden');
    };
    document.getElementById('btnFontMinus').onclick = (e) => {
        e.stopPropagation();
        currentFontSize = Math.max(12, currentFontSize - 2);
        updateFontSize();
    };
    document.getElementById('btnFontPlus').onclick = (e) => {
        e.stopPropagation();
        currentFontSize = Math.min(36, currentFontSize + 2);
        updateFontSize();
    };

    document.addEventListener('click', (e) => {
        if (!speedPopover.contains(e.target) && e.target !== speedToggleBtn) {
            speedPopover.classList.add('hidden');
        }
        if (!fontSizePopover.contains(e.target) && e.target !== fontSizeToggleBtn) {
            fontSizePopover.classList.add('hidden');
        }
    });

    const savedTheme = localStorage.getItem('reader-theme') || 'dark';
    document.body.setAttribute('data-theme', savedTheme);
    if (themeSelect) {
        themeSelect.value = savedTheme;
        themeSelect.addEventListener('change', () => {
            const theme = themeSelect.value;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('reader-theme', theme);
        });
    }

    // Scroll Observation
    readerBody.addEventListener('touchmove', () => { userTouchScrolling = true; }, { passive: true });
    readerBody.addEventListener('wheel', () => { userTouchScrolling = true; }, { passive: true });

    const observer = new IntersectionObserver((entries) => {
        if (isPlaying || isPaused || observerBlocked || !userTouchScrolling) return;

        if (readerBody.scrollTop <= 30) {
            if (currentIndex !== 0) {
                currentIndex = 0;
                syncCurrentUnitFromParagraph();
                updateProgress();
                saveDebounced();
            }
            return;
        }

        const visibleIndices = entries
            .filter(e => e.isIntersecting)
            .map(e => parseInt(e.target.id.replace('p-', ''), 10))
            .filter(n => !isNaN(n));

        if (visibleIndices.length > 0) {
            const topVisibleIdx = Math.min(...visibleIndices);
            if (topVisibleIdx !== currentIndex) {
                currentIndex = topVisibleIdx;
                syncCurrentUnitFromParagraph();
                updateProgress();
                saveDebounced();
            }
        }
    }, { root: readerBody, rootMargin: '0px', threshold: 0.5 });

    // File Upload Handlers
    document.getElementById('fb2File').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(!file) return;

        stop();
        fileNameDisp.textContent = file.name;
        fileNameDisp.parentElement.title = file.name;
        deckBookTitle.textContent = file.name;
        bookKey = file.name; 
        const ext = file.name.split('.').pop().toLowerCase();
        deckFormatInfo.textContent = `${ext.toUpperCase()} • READY`;

        statusInfo.textContent = "Processing file...";
        readerBody.innerHTML = '<div style="text-align: center; margin-top: 60px; color: var(--text-muted); font-size:14px;">Parsing document...</div>';

        if (ext === 'fb2' || ext === 'xml') {
            const reader = new FileReader();
            reader.onload = (evt) => parseFB2(evt.target.result);
            reader.readAsText(file);
        } else if (ext === 'txt') {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const txt = evt.target.result;
                const looksLikeMarkdown = /(^|\n)(#{1,6}\s|>\s|[-*]\s|\d+\.\s)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)/m.test(txt);
                if (looksLikeMarkdown) parseMD(txt);
                else parseTXT(txt);
            };
            reader.readAsText(file);
        } else if (['md', 'markdown', 'mdown', 'mkd'].includes(ext)) {
            const reader = new FileReader();
            reader.onload = (evt) => parseMD(evt.target.result);
            reader.readAsText(file);
        } else if (ext === 'docx') {
            const reader = new FileReader();
            reader.onload = (evt) => parseDOCX(evt.target.result);
            reader.readAsArrayBuffer(file);
        } else if (ext === 'pdf') {
            const reader = new FileReader();
            reader.onload = (evt) => parsePDF(evt.target.result);
            reader.readAsArrayBuffer(file);
        } else {
            const reader = new FileReader();
            reader.onload = (evt) => parseMD(evt.target.result);
            reader.readAsText(file);
        }
    });

    async function parsePDF(arrayBuffer) {
        try {
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdf = await loadingTask.promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                let rawPageText = textContent.items.map(item => item.str).join(" ");
                fullText += rawPageText.replace(/\s+/g, ' ') + " ";
            }
            parseTXT(fullText.replace(/([.?!])\s+([A-Za-zА-Яа-яЁё])/g, "$1\n$2"));
        } catch (err) {
            statusInfo.textContent = "PDF reading error";
        }
    }

    function parseFB2(xmlString) {
        const xml = new DOMParser().parseFromString(xmlString, "text/xml");
        const binaries = {};
        const binaryTags = xml.getElementsByTagName('binary');
        for(let i = 0; i < binaryTags.length; i++) {
            const id = binaryTags[i].getAttribute('id');
            const cType = binaryTags[i].getAttribute('content-type') || 'image/jpeg';
            binaries[id] = `data:${cType};base64,${binaryTags[i].textContent.replace(/\s+/g, '')}`;
        }

        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;
        const getHref = (node) => {
            for (let j = 0; j < node.attributes.length; j++) {
                if (node.attributes[j].name.includes('href')) return node.attributes[j].value;
            }
            return null;
        };

        const coverpages = xml.getElementsByTagName('coverpage');
        if (coverpages.length > 0) {
            const coverImages = coverpages[0].getElementsByTagName('image');
            for (let img of coverImages) {
                const href = getHref(img);
                if (href) {
                    const id = href.replace(/^#/, '');
                    if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                }
            }
        }

        const bodies = xml.getElementsByTagName('body');
        for (let b = 0; b < bodies.length; b++) {
            const walk = (node, inTitle = false) => {
                if (node.nodeType === 1) {
                    const tagName = node.tagName.replace(/^.*:/, '').toLowerCase();
                    if (tagName === 'title') {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i], true);
                    } else if (['p', 'v', 'subtitle', 'text-author'].includes(tagName)) {
                        const text = node.textContent.replace(/[*#]/g, '').trim();
                        if (text.length > 1) {
                            const isHeading = inTitle || tagName === 'subtitle';
                            const idx = pIndex++;
                            const block = {
                                type: 'text',
                                text: text,
                                className: isHeading ? (inTitle ? 'md-h2' : 'md-h3') : '',
                                index: idx
                            };
                            allBlocks.push(block);
                            textParagraphs.push(block);
                            if (isHeading) {
                                tocItems.push({ title: text.slice(0, 90), level: inTitle ? 1 : 2, paragraphIndex: idx });
                            }
                        }
                    } else if (tagName === 'image') {
                        const href = getHref(node);
                        if (href) {
                            const id = href.replace(/^#/, '');
                            if (binaries[id]) allBlocks.push({ type: 'image', src: binaries[id] });
                        }
                    } else {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i], inTitle);
                    }
                }
            };
            walk(bodies[b], false);
        }
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseMD(textString) {
        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;
        if (typeof marked === 'undefined') return parseTXT(textString);

        let html;
        try { html = marked.parse(textString, { breaks: true, gfm: true }); } 
        catch (e) { return parseTXT(textString); }

        const container = document.createElement('div');
        container.innerHTML = html;
        container.querySelectorAll('a').forEach(a => a.replaceWith(document.createTextNode(a.textContent)));
        const norm = (s) => (s || '').replace(/\s+/g, ' ').trim();

        const addTextBlock = (el, className, headingLevel = 0) => {
            const text = norm(el.textContent);
            if (!text) return;
            const idx = pIndex++;
            const block = {
                type: 'text',
                text: text,
                html: el.innerHTML,
                className: className || '',
                index: idx
            };
            allBlocks.push(block);
            textParagraphs.push(block);
            if (headingLevel > 0) {
                tocItems.push({ title: text, level: headingLevel, paragraphIndex: idx });
            }
        };

        for (const child of Array.from(container.children)) {
            const tag = child.tagName.toLowerCase();
            if (/^h[1-6]$/.test(tag)) {
                addTextBlock(child, 'md-' + tag, parseInt(tag.substring(1), 10));
            } else if (tag === 'p') {
                addTextBlock(child, '');
            } else if (tag === 'ul' || tag === 'ol') {
                for (const li of Array.from(child.children)) {
                    if (li.tagName.toLowerCase() === 'li') addTextBlock(li, 'md-li');
                }
            } else if (tag === 'blockquote') {
                addTextBlock(child, 'md-quote');
            } else if (tag === 'pre') {
                const codeText = child.textContent || '';
                if (codeText.trim()) allBlocks.push({ type: 'code', html: child.innerHTML, text: codeText });
            } else if (tag === 'hr') {
                allBlocks.push({ type: 'hr' });
            } else {
                addTextBlock(child, '');
            }
        }
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseTXT(textString) {
        allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;
        textString.split(/\r?\n/).forEach(line => {
            const raw = line.trim();
            if (raw.length > 1) {
                const mdMatch = raw.match(/^(#{1,6})\s+(.+)$/);
                const idx = pIndex++;
                if (mdMatch) {
                    const lvl = mdMatch[1].length;
                    const cleanTitle = mdMatch[2].trim();
                    allBlocks.push({ type: 'text', text: cleanTitle, className: 'md-h' + lvl, index: idx });
                    textParagraphs.push(allBlocks[allBlocks.length - 1]);
                    tocItems.push({ title: cleanTitle, level: lvl, paragraphIndex: idx });
                } else {
                    const block = { type: 'text', text: raw, index: idx };
                    allBlocks.push(block);
                    textParagraphs.push(block);
                }
            }
        });
        buildReadingUnitsServer().then(() => loadProgressAndRender());
    }

    function parseDOCX(arrayBuffer) {
        mammoth.convertToHtml({arrayBuffer: arrayBuffer}).then(result => {
            const doc = new DOMParser().parseFromString(result.value, "text/html");
            allBlocks = []; textParagraphs = []; tocItems = []; let pIndex = 0;

            const walk = (node) => {
                if (node.nodeType === 1) { 
                    const tagName = node.tagName.toLowerCase();
                    if (tagName === 'img') {
                        const src = node.getAttribute('src');
                        if (src) allBlocks.push({ type: 'image', src: src });
                    } else if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li'].includes(tagName)) {
                        const text = node.textContent.trim();
                        if (text.length > 1) {
                            const idx = pIndex++;
                            const isH = /^h[1-6]$/.test(tagName);
                            allBlocks.push({ type: 'text', text: text, className: isH ? ('md-' + tagName) : '', index: idx });
                            textParagraphs.push(allBlocks[allBlocks.length - 1]);
                            if (isH) {
                                tocItems.push({ title: text, level: parseInt(tagName.substring(1), 10), paragraphIndex: idx });
                            }
                        }
                    } else {
                        for (let i = 0; i < node.childNodes.length; i++) walk(node.childNodes[i]);
                    }
                }
            };
            walk(doc.body);
            buildReadingUnitsServer().then(() => loadProgressAndRender());
        });
    }

    async function buildReadingUnitsServer() {
        readingUnits = [];
        let unitCounter = 0;
        statusInfo.textContent = "Splitting into sentences...";

        try {
            const rawParagraphs = textParagraphs.map(p => p.text);
            const res = await fetch('/api/split', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paragraphs: rawParagraphs })
            });
            const data = await res.json();

            if (data.results && data.results.length === textParagraphs.length) {
                for (let i = 0; i < textParagraphs.length; i++) {
                    const chunks = data.results[i];
                    for (const ch of chunks) {
                        readingUnits.push({ unitIndex: unitCounter++, paragraphIndex: textParagraphs[i].index, text: ch });
                    }
                }
            } else {
                fallbackSplit(unitCounter);
            }
        } catch (e) {
            fallbackSplit(unitCounter);
        }
    }

    function fallbackSplit(unitCounter) {
        readingUnits = [];
        for (const p of textParagraphs) {
            readingUnits.push({ unitIndex: unitCounter++, paragraphIndex: p.index, text: p.text });
        }
    }

    function syncCurrentUnitFromParagraph() {
        const found = readingUnits.findIndex(u => u.paragraphIndex >= currentIndex);
        currentUnitIndex = found !== -1 ? found : 0;
        lastRequestedUnitIndex = currentUnitIndex - 1;
    }

    function loadProgressAndRender() {
        observerBlocked = true;
        userTouchScrolling = false;
        fetch(`/load_progress?book_name=${encodeURIComponent(bookKey)}`)
            .then(r => r.json())
            .then(data => {
                currentIndex = data.index || 0;
                if (currentIndex >= textParagraphs.length || currentIndex < 0) currentIndex = 0;
                syncCurrentUnitFromParagraph();
                render();
            }).catch(() => { 
                currentIndex = 0; 
                syncCurrentUnitFromParagraph();
                render(); 
            });
    }

    function render() {
        observer.disconnect();
        observerBlocked = true;
        userTouchScrolling = false;
        readerBody.innerHTML = '';
        statusInfo.textContent = "Ready to read";

        allBlocks.forEach(block => {
            if (block.type === 'text') {
                const div = document.createElement('div');
                div.className = 'paragraph' + (block.className ? ' ' + block.className : '');
                div.id = 'p-' + block.index;

                if (block.html) div.innerHTML = block.html;
                else div.textContent = block.text;

                div.onclick = () => { 
                    const sel = window.getSelection();
                    if (sel && !sel.isCollapsed && sel.toString().trim().length > 0) return;
                    
                    currentIndex = block.index; 
                    syncCurrentUnitFromParagraph();
                    hasPendingJump = true;
                    saveDebounced(); 
                    
                    if(isPlaying) {
                        stop();
                        hasPendingJump = true;
                        setTimeout(() => { playBtn.click(); }, 120);
                    } else {
                        scrollToCurrent();
                    }
                };
                readerBody.appendChild(div);
            } else if (block.type === 'code') {
                const div = document.createElement('div');
                div.className = 'paragraph md-pre';
                div.innerHTML = block.html;
                readerBody.appendChild(div);
            } else if (block.type === 'hr') {
                const hr = document.createElement('hr');
                hr.className = 'md-hr';
                readerBody.appendChild(hr);
            } else if (block.type === 'image') {
                const img = document.createElement('img');
                img.src = block.src; img.className = 'fb2-image';
                readerBody.appendChild(img);
            }
        });
        updateProgress();
        setTimeout(scrollToCurrent, 100);
    }

    let saveTimeout;
    function saveDebounced() {
        updateProgress(); clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            fetch('/save_progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ book_name: bookKey, index: currentIndex })
            }).catch(err => console.error("Progress save failed:", err));
        }, 1000); 
    }

    function updateProgress() {
        if (textParagraphs.length > 0) {
            progressInfo.textContent = `${currentIndex + 1} / ${textParagraphs.length}`;
        }
        bufferInfo.textContent = `buf: ${playlist.length}/${PREFETCH_AHEAD}`;
    }

    function scrollToCurrent() {
        const el = document.getElementById('p-' + currentIndex);
        if(el) {
            document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
            el.classList.add('active-text');
            observer.disconnect();
            observerBlocked = true;

            if (currentIndex === 0) {
                readerBody.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                const targetScrollTop = el.offsetTop - readerBody.offsetTop - (readerBody.clientHeight / 2) + (el.clientHeight / 2);
                readerBody.scrollTo({ top: Math.max(0, targetScrollTop), behavior: 'smooth' });
            }

            setTimeout(() => {
                document.querySelectorAll('.paragraph').forEach(p => observer.observe(p));
                observerBlocked = false;
            }, 1200);
        }
    }

    function updateMediaSession(text) {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'SileroRead',
                artist: text.length > 40 ? text.substring(0, 40) + '...' : text,
                album: bookKey || 'Audiobook'
            });
            navigator.mediaSession.setActionHandler('play', () => { if(isPaused) playBtn.click(); });
            navigator.mediaSession.setActionHandler('pause', () => { pauseBtn.click(); });
            navigator.mediaSession.setActionHandler('stop', () => { stopBtn.click(); });
            navigator.mediaSession.setActionHandler('previoustrack', () => { jumpToUnit(currentUnitIndex - 1); });
            navigator.mediaSession.setActionHandler('nexttrack', () => { jumpToUnit(currentUnitIndex + 1); });
        }
    }

    playBtn.onclick = () => {
        requestWakeLock();

        if (isPaused) {
            isPaused = false;
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            stopBtn.style.display = 'flex';
            floatingPad.classList.add('reading-mode');
            statusInfo.textContent = "Playing...";

            if (audioPlayer.src && audioPlayer.currentTime > 0 && !audioPlayer.ended) {
                audioPlayer.play().catch(() => playAudio());
            } else if (playlist.length > 0) {
                playAudio();
            } else {
                lastRequestedUnitIndex = currentUnitIndex - 1;
                fetchNext();
            }
            return;
        }

        if(!readingUnits.length) return;
        currentSessionId++; 
        isPlaying = true; 
        isPaused = false;
        playBtn.style.display = 'none'; 
        pauseBtn.style.display = 'flex';
        stopBtn.style.display = 'flex';
        floatingPad.classList.add('reading-mode');
        
        playlist = [];
        currentPlayingItem = null;
        if (!hasPendingJump) syncCurrentUnitFromParagraph();
        hasPendingJump = false;
        statusInfo.textContent = "Buffering audio...";
        fetchNext();
    };

    pauseBtn.onclick = () => {
        releaseWakeLock();
        isPaused = true;
        audioPlayer.pause();
        playBtn.style.display = 'flex';
        pauseBtn.style.display = 'none';
        floatingPad.classList.remove('reading-mode');
        statusInfo.textContent = "Paused";
    };

    stopBtn.onclick = stop;

    function stop() {
        releaseWakeLock();
        currentSessionId++; 
        isPlaying = false; 
        isPaused = false; 
        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false; 
        playlist = [];
        currentPlayingItem = null;
        lastRequestedUnitIndex = -1;
        audioPlayer.pause(); 
        audioPlayer.removeAttribute('src');
        playBtn.style.display = 'flex'; 
        pauseBtn.style.display = 'none';
        stopBtn.style.display = 'none';
        floatingPad.classList.remove('reading-mode');
        statusInfo.textContent = "Stopped";
        clearChunkHighlight();
        timingStats = { totalChars: 0, totalDuration: 0, sampleCount: 0 };
        updateTimeEstimate();
        updateProgress();
    }

    // ================= CHUNK NAVIGATION =================
    function jumpToUnit(targetIndex) {
        if (!readingUnits.length) return;
        if (targetIndex < 0) targetIndex = 0;
        if (targetIndex >= readingUnits.length) targetIndex = readingUnits.length - 1;

        if (navigator.vibrate) navigator.vibrate(20);

        const wasPlaying = isPlaying && !isPaused;
        currentSessionId++;
        playlist = [];
        currentPlayingItem = null;
        if (fetchAbortController) {
            try { fetchAbortController.abort(); } catch (_) {}
            fetchAbortController = null;
        }
        clearTimeout(fetchTimeoutId);
        isFetching = false;
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');

        currentUnitIndex = targetIndex;
        lastRequestedUnitIndex = targetIndex - 1;

        const item = readingUnits[targetIndex];
        if (item) {
            currentIndex = item.paragraphIndex;
            scrollToCurrent();
            highlightChunk(item.paragraphIndex, item.text);
            saveDebounced();
        }
        updateProgress();
        updateTimeEstimate();

        if (wasPlaying) {
            isPlaying = true;
            isPaused = false;
            playBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';
            stopBtn.style.display = 'flex';
            statusInfo.textContent = `Chunk ${targetIndex + 1} / ${readingUnits.length}`;
            fetchNext();
        } else {
            isPlaying = false;
            isPaused = false;
            playBtn.style.display = 'flex';
            pauseBtn.style.display = 'none';
            stopBtn.style.display = 'none';
            statusInfo.textContent = `Chunk ${targetIndex + 1} / ${readingUnits.length}`;
            hasPendingJump = true;
        }
    }

    const prevBtnEl = document.getElementById('prevBtn');
    let prevHoldTimer = null;
    let prevLongPressed = false;

    function startPrevHold() {
        prevLongPressed = false;
        clearTimeout(prevHoldTimer);
        prevHoldTimer = setTimeout(() => {
            prevLongPressed = true;
            jumpToUnit(0);
            statusInfo.textContent = "⏮ Jumped to start";
        }, 600);
    }
    function endPrevHold() { clearTimeout(prevHoldTimer); }

    prevBtnEl.addEventListener('mousedown', startPrevHold);
    prevBtnEl.addEventListener('mouseup', endPrevHold);
    prevBtnEl.addEventListener('mouseleave', endPrevHold);
    prevBtnEl.addEventListener('touchstart', startPrevHold, { passive: true });
    prevBtnEl.addEventListener('touchend', endPrevHold);
    prevBtnEl.addEventListener('touchcancel', endPrevHold);

    prevBtnEl.onclick = () => {
        if (prevLongPressed) {
            prevLongPressed = false;
            return;
        }
        jumpToUnit(currentUnitIndex - 1);
    };

    document.getElementById('nextBtn').onclick = () => {
        jumpToUnit(currentUnitIndex + 1);
    };

    // ================= PREFETCH & SYNTHESIS =================
    function fetchNext() {
        if (!isPlaying || isFetching || isPaused) return;

        const nextTargetUnitIndex = Math.max(lastRequestedUnitIndex + 1, currentUnitIndex);
        if (nextTargetUnitIndex >= readingUnits.length) return;
        if (playlist.length >= MAX_PLAYLIST) return;
        if (playlist.length >= PREFETCH_AHEAD && !audioPlayer.paused) return;

        isFetching = true;
        lastRequestedUnitIndex = nextTargetUnitIndex;

        const item = readingUnits[nextTargetUnitIndex];
        const fetchSessionId = currentSessionId;

        const fd = new FormData();
        fd.append('text', item.text);
        fd.append('voice', voiceSelect.value);

        fetchAbortController = new AbortController();
        clearTimeout(fetchTimeoutId);
        fetchTimeoutId = setTimeout(() => {
            if (fetchAbortController) {
                try { fetchAbortController.abort(); } catch (_) {}
            }
        }, FETCH_TIMEOUT_MS);

        fetch('/synthesize', {
            method: 'POST',
            body: fd,
            signal: fetchAbortController.signal
        })
            .then(r => r.json())
            .then(data => {
                clearTimeout(fetchTimeoutId);
                isFetching = false;
                fetchAbortController = null;

                if (!isPlaying || fetchSessionId !== currentSessionId) return;

                if (data.success) {
                    playlist.push({ 
                        url: data.audio_url, 
                        paragraphIndex: item.paragraphIndex,
                        unitIndex: item.unitIndex,
                        text: item.text 
                    });
                    updateProgress();

                    if (audioPlayer.paused && playlist.length >= 1 && !isPaused) playAudio();
                    fetchNext();
                } else {
                    lastRequestedUnitIndex = item.unitIndex - 1;
                    if (playlist.length === 0 && audioPlayer.paused) {
                        pauseOnError(`⚠️ Synth error on chunk #${item.unitIndex + 1}`);
                    }
                }
            }).catch(() => { 
                clearTimeout(fetchTimeoutId);
                isFetching = false;
                fetchAbortController = null;
                if (!isPlaying || fetchSessionId !== currentSessionId) return;

                lastRequestedUnitIndex = item.unitIndex - 1;
                if (playlist.length === 0 && audioPlayer.paused) {
                    pauseOnError(`⚠️ Network error on chunk #${item.unitIndex + 1} (press Play)`);
                }
            });
    }

    // ================= HIGHLIGHTING =================
    function findChunkRange(fullText, chunkText) {
        let idx = fullText.indexOf(chunkText);
        if (idx !== -1) return { start: idx, end: idx + chunkText.length };

        try {
            const regex = new RegExp(chunkText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+'));
            const match = fullText.match(regex);
            if (match) return { start: match.index, end: match.index + match[0].length };
        } catch (_) {}
        return null;
    }

    function clearChunkHighlight() {
        document.querySelectorAll('.chunk-active').forEach(span => {
            const parent = span.parentNode;
            if (!parent) return;
            const textNode = document.createTextNode(span.textContent);
            parent.replaceChild(textNode, span);
            parent.normalize();
        });
    }

    function highlightChunk(paragraphIndex, chunkText) {
        clearChunkHighlight();
        const para = document.getElementById('p-' + paragraphIndex);
        if (!para) return;

        const walker = document.createTreeWalker(para, NodeFilter.SHOW_TEXT);
        const nodes = [];
        let fullText = '', n;
        while (n = walker.nextNode()) {
            nodes.push({ node: n, start: fullText.length });
            fullText += n.nodeValue;
        }

        const range = findChunkRange(fullText, chunkText);
        if (!range) return;

        const { start, end } = range;
        const pieces = [];
        for (const { node, start: nodeStart } of nodes) {
            const nodeLen = node.nodeValue.length;
            const nodeEnd = nodeStart + nodeLen;
            if (nodeEnd <= start || nodeStart >= end) continue;
            pieces.push({
                node: node,
                from: Math.max(0, start - nodeStart),
                to: Math.min(nodeLen, end - nodeStart)
            });
        }

        for (let i = pieces.length - 1; i >= 0; i--) {
            const { node, from, to } = pieces[i];
            const val = node.nodeValue;
            const before = val.substring(0, from);
            const middle = val.substring(from, to);
            const after = val.substring(to);

            const span = document.createElement('span');
            span.className = 'chunk-active';
            span.textContent = middle;

            const frag = document.createDocumentFragment();
            if (before) frag.appendChild(document.createTextNode(before));
            frag.appendChild(span);
            if (after) frag.appendChild(document.createTextNode(after));

            node.parentNode.replaceChild(frag, node);
        }

        const firstSpan = para.querySelector('.chunk-active');
        if (firstSpan) {
            const rect = firstSpan.getBoundingClientRect();
            const bodyRect = readerBody.getBoundingClientRect();
            const targetScrollTop = (rect.top - bodyRect.top + readerBody.scrollTop) - (readerBody.clientHeight / 2) + (rect.height / 2);
            readerBody.scrollTo({ top: Math.max(0, targetScrollTop), behavior: 'smooth' });
        }
    }

    function playAudio() {
        if (!isPlaying || !playlist.length || isPaused) return;
        
        const audioItem = playlist.shift();
        currentPlayingItem = audioItem;
        currentUnitIndex = audioItem.unitIndex;
        
        if (currentIndex !== audioItem.paragraphIndex) {
            currentIndex = audioItem.paragraphIndex;
            saveDebounced();
        }
        
        highlightChunk(audioItem.paragraphIndex, audioItem.text);
        document.querySelectorAll('.paragraph').forEach(p => p.classList.remove('active-text'));
        const activePara = document.getElementById('p-' + audioItem.paragraphIndex);
        if (activePara) activePara.classList.add('active-text');
        
        updateProgress();
        updateMediaSession(audioItem.text);
        
        statusInfo.textContent = "Speaking...";
        audioPlayer.src = audioItem.url;
        audioPlayer.playbackRate = currentPlaybackRate;
        
        audioPlayer.play().catch(e => {
            pauseOnError(`⚠️ Press Play (chunk #${audioItem.unitIndex + 1})`);
        });

        const onMeta = () => {
            const dur = audioPlayer.duration;
            if (isFinite(dur) && dur > 0 && timingStats.sampleCount < SAMPLE_SIZE) {
                timingStats.totalChars += audioItem.text.length;
                timingStats.totalDuration += dur;
                timingStats.sampleCount++;
                updateTimeEstimate();
            }
            audioPlayer.removeEventListener('loadedmetadata', onMeta);
        };
        audioPlayer.addEventListener('loadedmetadata', onMeta);
        updateTimeEstimate();

        fetchNext();
    }

    audioPlayer.onended = () => {
        currentPlayingItem = null;
        if (isPlaying && !isPaused) {
            if (playlist.length > 0) {
                playAudio();
            } else if (lastRequestedUnitIndex + 1 < readingUnits.length) {
                statusInfo.textContent = "Buffering next...";
                fetchNext();
            } else {
                stop();
                statusInfo.textContent = "Finished reading";
            }
        }
    };

    function formatTime(sec) {
        if (!isFinite(sec) || sec < 0) return '--';
        if (sec < 60) return Math.round(sec) + 's';
        if (sec < 3600) return Math.round(sec / 60) + 'm';
        return Math.floor(sec / 3600) + 'h ' + Math.round((sec % 3600) / 60) + 'm';
    }

    function updateTimeEstimate() {
        const timeInfo = document.getElementById('timeInfo');
        if (!timeInfo || timingStats.sampleCount < 1 || !readingUnits.length) {
            if (timeInfo) timeInfo.textContent = '⏱ --';
            return;
        }
        const charsPerSec = timingStats.totalChars / timingStats.totalDuration;
        if (!isFinite(charsPerSec) || charsPerSec <= 0) return;

        let remainingChars = 0;
        for (let i = currentUnitIndex; i < readingUnits.length; i++) {
            remainingChars += readingUnits[i].text.length;
        }
        const remainingSec = remainingChars / charsPerSec / currentPlaybackRate;
        timeInfo.textContent = '⏱ ~' + formatTime(remainingSec);
    }

    // ================= MODALS & UTILS =================
    function openTocModal() {
        if (!textParagraphs.length) {
            statusInfo.textContent = '⚠️ Load a book first';
            return;
        }
        const list = document.getElementById('tocList');
        if (!tocItems.length) {
            list.innerHTML = '<div style="color:var(--text-muted); padding:20px; text-align:center;">No headings found</div>';
        } else {
            let activeTocIdx = -1;
            for (let i = 0; i < tocItems.length; i++) {
                if (tocItems[i].paragraphIndex <= currentIndex) activeTocIdx = i;
                else break;
            }
            list.innerHTML = tocItems.map((item, idx) => `
                <div class="toc-item ${idx === activeTocIdx ? 'active-toc' : ''}" onclick="jumpToHeading(${item.paragraphIndex})">
                    <div class="toc-title toc-lvl-${item.level}">${escapeHtml(item.title)}</div>
                    <span class="toc-badge">¶ ${item.paragraphIndex + 1}</span>
                </div>
            `).join('');
        }
        document.getElementById('tocModal').classList.remove('hidden');
    }

    function closeTocModal() { document.getElementById('tocModal').classList.add('hidden'); }
    function jumpToHeading(paragraphIdx) {
        closeTocModal();
        const targetUnit = readingUnits.findIndex(u => u.paragraphIndex >= paragraphIdx);
        if (targetUnit !== -1) jumpToUnit(targetUnit);
        else {
            currentIndex = paragraphIdx;
            scrollToCurrent();
            saveDebounced();
        }
    }

    document.getElementById('tocBtn').onclick = openTocModal;
    document.getElementById('tocModal').addEventListener('click', (e) => {
        if (e.target.id === 'tocModal') closeTocModal();
    });

    async function loadBookmarks() {
        if (!bookKey) return [];
        try {
            const res = await fetch(`/api/bookmarks?book_name=${encodeURIComponent(bookKey)}`);
            const data = await res.json();
            return data.success ? data.bookmarks : [];
        } catch (_) { return []; }
    }

    function openBookmarkModal() {
        if (!readingUnits.length) return;
        const currentItem = readingUnits[currentUnitIndex];
        document.getElementById('bookmarkNameInput').value = currentItem ? currentItem.text.substring(0, 45) : '';
        document.getElementById('bookmarkModal').classList.remove('hidden');
    }
    function closeBookmarkModal() { document.getElementById('bookmarkModal').classList.add('hidden'); }

    async function confirmSaveBookmark() {
        const name = document.getElementById('bookmarkNameInput').value.trim();
        const currentItem = readingUnits[currentUnitIndex];
        if (!currentItem) return;

        try {
            await fetch('/api/bookmarks/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    book_name: bookKey,
                    unit_index: currentUnitIndex,
                    paragraph_index: currentItem.paragraphIndex,
                    text: currentItem.text,
                    name: name || currentItem.text.substring(0, 35)
                })
            });
            closeBookmarkModal();
            statusInfo.textContent = '⭐ Bookmark saved';
        } catch (_) {}
    }

    function toggleBookmarkSnippet(id) {
        const el = document.getElementById('bm-snip-' + id);
        if (el) el.classList.toggle('expanded');
    }

    async function openBookmarksList() {
        if (!bookKey) return;
        const bm = await loadBookmarks();
        const list = document.getElementById('bookmarksList');
        if (!bm.length) {
            list.innerHTML = '<div style="color:var(--text-muted); padding:20px; text-align:center;">No bookmarks yet</div>';
        } else {
            list.innerHTML = bm.map(b => `
                <div class="bookmark-item">
                    <div class="bm-text" onclick="toggleBookmarkSnippet(${b.id})" style="cursor:pointer;">
                        <div class="bm-name">${escapeHtml(b.name)}</div>
                        ${b.text ? `<div class="bm-snippet" id="bm-snip-${b.id}">${escapeHtml(b.text)}</div>` : ''}
                        <div class="bm-meta">${b.created_at} · chunk ${b.unit_index + 1}</div>
                    </div>
                    <div class="bm-actions">
                        <button class="bm-btn" onclick="toggleBookmarkSnippet(${b.id})">👁</button>
                        <button class="bm-btn" onclick="jumpToBookmark(${b.unit_index})">→</button>
                        <button class="bm-btn delete" onclick="deleteBookmark(${b.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }
        document.getElementById('bookmarksListModal').classList.remove('hidden');
    }
    function closeBookmarksList() { document.getElementById('bookmarksListModal').classList.add('hidden'); }
    function jumpToBookmark(unitIndex) {
        closeBookmarksList();
        if (unitIndex >= 0 && unitIndex < readingUnits.length) jumpToUnit(unitIndex);
    }
    async function deleteBookmark(id) {
        await fetch('/api/bookmarks/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ book_name: bookKey, id: id })
        });
        openBookmarksList();
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    document.getElementById('addBookmarkBtn').onclick = openBookmarkModal;
    document.getElementById('showBookmarksBtn').onclick = openBookmarksList;
    document.getElementById('bookmarkModal').addEventListener('click', (e) => {
        if (e.target.id === 'bookmarkModal') closeBookmarkModal();
    });
    document.getElementById('bookmarksListModal').addEventListener('click', (e) => {
        if (e.target.id === 'bookmarksListModal') closeBookmarksList();
    });

    // Lock Screen
    const lockBtn = document.getElementById('lockBtn');
    const lockOverlay = document.getElementById('lock-overlay');
    const unlockZone = document.getElementById('unlock-zone');
    let unlockTimeout;

    lockBtn.addEventListener('click', () => lockOverlay.classList.remove('hidden'));

    function startUnlockTimer() {
        unlockZone.style.borderColor = 'var(--accent-cyan)';
        unlockZone.style.color = 'var(--accent-cyan)';
        unlockTimeout = setTimeout(() => {
            lockOverlay.classList.add('hidden');
            unlockZone.style.borderColor = 'var(--border-color)';
            unlockZone.style.color = 'var(--text-muted)';
        }, 1000);
    }
    function cancelUnlockTimer() {
        clearTimeout(unlockTimeout);
        unlockZone.style.borderColor = 'var(--border-color)';
        unlockZone.style.color = 'var(--text-muted)';
    }

    unlockZone.addEventListener('touchstart', (e) => { e.preventDefault(); startUnlockTimer(); }, {passive: false});
    unlockZone.addEventListener('touchend', cancelUnlockTimer);
    unlockZone.addEventListener('touchcancel', cancelUnlockTimer);
    unlockZone.addEventListener('mousedown', startUnlockTimer);
    unlockZone.addEventListener('mouseup', cancelUnlockTimer);
    unlockZone.addEventListener('mouseleave', cancelUnlockTimer);

    // Paste Modal
    const pasteTabBtn = document.getElementById('pasteTabBtn');
    const pasteTextModal = document.getElementById('pasteTextModal');
    const pastedTextInput = document.getElementById('pastedTextInput');
    const btnClipboardPaste = document.getElementById('btnClipboardPaste');
    const btnClipboardClear = document.getElementById('btnClipboardClear');
    const btnClosePasteModal = document.getElementById('btnClosePasteModal');
    const btnTopClosePasteModal = document.getElementById('btnTopClosePasteModal');
    const btnReadPastedText = document.getElementById('btnReadPastedText');

    const savedDraft = localStorage.getItem('sileroread-pasted-draft');
    if (savedDraft) pastedTextInput.value = savedDraft;
    pastedTextInput.addEventListener('input', () => localStorage.setItem('sileroread-pasted-draft', pastedTextInput.value));

    pasteTabBtn.addEventListener('click', () => {
        pasteTextModal.classList.remove('hidden');
        setTimeout(() => pastedTextInput.focus(), 100);
    });
    btnClosePasteModal.addEventListener('click', () => pasteTextModal.classList.add('hidden'));
    btnTopClosePasteModal.addEventListener('click', () => pasteTextModal.classList.add('hidden'));
    pasteTextModal.addEventListener('click', (e) => {
        if (e.target === pasteTextModal) pasteTextModal.classList.add('hidden');
    });

    btnClipboardPaste.addEventListener('click', async () => {
        try {
            const clipText = await navigator.clipboard.readText();
            if (clipText) {
                const start = pastedTextInput.selectionStart;
                const end = pastedTextInput.selectionEnd;
                pastedTextInput.value = pastedTextInput.value.slice(0, start) + clipText + pastedTextInput.value.slice(end);
                localStorage.setItem('sileroread-pasted-draft', pastedTextInput.value);
                pastedTextInput.focus();
            }
        } catch (_) {
            pastedTextInput.focus();
            alert('Browser requested manual paste (Ctrl+V / long press).');
        }
    });

    btnClipboardClear.addEventListener('click', () => {
        pastedTextInput.value = '';
        localStorage.removeItem('sileroread-pasted-draft');
        pastedTextInput.focus();
    });

    btnReadPastedText.addEventListener('click', () => {
        const rawText = pastedTextInput.value.trim();
        if (!rawText) return;
        pasteTextModal.classList.add('hidden');
        stop();

        let hash = 0;
        for (let i = 0; i < rawText.length; i++) {
            hash = ((hash << 5) - hash) + rawText.charCodeAt(i);
            hash |= 0;
        }
        const firstLine = rawText.split(/\r?\n/)[0].replace(/[#>*_`~]/g, '').trim().slice(0, 28) || 'Pasted Text';
        bookKey = `pasted_${Math.abs(hash)}`;

        fileNameDisp.textContent = 'Clipboard';
        deckBookTitle.textContent = `📋 ${firstLine}`;
        deckFormatInfo.textContent = 'TEXT/MD • READY';
        statusInfo.textContent = 'Processing text...';

        const looksLikeMarkdown = /(^|\n)(#{1,6}\s|>\s|[-*]\s|\d+\.\s)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)/m.test(rawText);
        if (looksLikeMarkdown) parseMD(rawText);
        else parseTXT(rawText);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
        });
    }
</script>
